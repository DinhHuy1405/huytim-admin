<style>
/* Văn phòng Agent 3D: mỗi nhóm session Claude là một phòng ban, mỗi session là một nhân viên.
   Không có dữ liệu thật trong file này; trạng thái đọc từ bảng hub.agent_office (chỉ owner xem), lịch trên máy Huy ghi vào mỗi giờ. */
:root{--run:#1d9e75;--today:#c98a1b;--idle:#a9a79f}
.stage{position:relative;height:calc(100vh - 96px);min-height:520px;border:1px solid var(--line,#E9E9E7);border-radius:8px;overflow:hidden;background:#ecebe6;margin-top:4px}
.stage canvas{display:block}
.vp{position:absolute;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid #e4e2db;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
#vside{top:12px;left:12px;width:264px;padding:14px;max-height:calc(100% - 24px);overflow:auto}
#vside .stamp{font-size:12px;color:#76746d;display:flex;align-items:center;gap:6px}
.live{width:6px;height:6px;border-radius:50%;background:var(--run);animation:pulse 2s infinite;flex:none}
.live.old{background:#c98a1b;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,158,117,.5)}70%{box-shadow:0 0 0 7px rgba(29,158,117,0)}100%{box-shadow:0 0 0 0 rgba(29,158,117,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.kpi{border:1px solid #e4e2db;border-radius:8px;padding:7px 4px;text-align:center;background:#fff}
.kpi b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11px;color:#76746d}
.vsec{font-size:11px;color:#9B9A97;text-transform:uppercase;letter-spacing:.05em;margin:2px 0 4px}
.dept{display:block;width:100%;text-align:left;font:inherit;background:none;border:1px solid transparent;border-radius:8px;padding:7px 8px;cursor:pointer;color:inherit}
.dept:hover,.dept.on{background:#fff;border-color:#e4e2db}
.dept .top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.dept .vsw{width:9px;height:9px;border-radius:3px;flex:none}
.dept .n{margin-left:auto;font-size:12px;color:#76746d;font-weight:400;font-variant-numeric:tabular-nums}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:#efede7;margin-top:6px}
.bar i{display:block;height:100%}
#vdetail{top:12px;right:12px;width:280px;padding:14px;display:none}
#vdetail .close{position:absolute;top:8px;right:10px;border:none;background:none;font-size:18px;color:#76746d;cursor:pointer}
#vdetail .who{font-size:15px;font-weight:600;padding-right:20px}
#vdetail .vpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:2px 9px;margin-top:6px;border:1px solid #e4e2db;background:#fff}
#vdetail dl{display:grid;grid-template-columns:92px 1fr;gap:6px 8px;font-size:13px;margin:12px 0 0}
#vdetail dt{color:#76746d}#vdetail dd{margin:0}
#vtools{bottom:12px;right:12px;padding:5px;display:flex;gap:4px}
#vtools button{font:inherit;font-size:12.5px;border:1px solid transparent;background:none;border-radius:7px;padding:5px 10px;cursor:pointer;color:#37352F}
#vtools button:hover{background:#fff;border-color:#e4e2db}
#vtools button.on{background:#37352F;color:#fff}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.tag{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;background:rgba(255,255,255,.96);border:1px solid #e4e2db;border-radius:999px;padding:3px 9px 3px 7px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;pointer-events:auto;color:#37352F;font-family:Inter,sans-serif}
.tag:hover{transform:scale(1.06)}
.tag .role{display:none;color:#76746d;font-weight:400}
.tag:hover .role,.tag.sel .role{display:inline}
.tag.sel{border-color:#37352F}
.tag.dim{opacity:.75}
.tag .lead{font-size:10px;font-weight:600;color:#fff;background:#37352F;border-radius:4px;padding:1px 5px;margin-left:2px}
.roomtag{font-size:13px;font-weight:600;color:#fff;border-radius:7px;padding:4px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:auto;cursor:pointer;font-family:Inter,sans-serif}
.bubble{font:500 11.5px Inter,sans-serif;color:#37352F;background:#fff;border:1px solid #dcdad3;border-radius:10px;padding:4px 9px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.08);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;pointer-events:none;position:relative}
.bubble{white-space:normal;max-width:230px;width:max-content;text-align:left}
.bubble.on{opacity:1;transform:none}
.tag.huy{background:#1f2937;color:#fff;border-color:#1f2937}.tag.huy .role{color:#cbd5e1}
.vclock{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#55534d;margin-top:6px;padding:6px 8px;border:1px solid #e4e2db;border-radius:8px;background:#fff}
.vclock b{font-weight:600;color:#37352F;font-variant-numeric:tabular-nums}
.bubble:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;width:8px;height:8px;background:#fff;border-right:1px solid #dcdad3;border-bottom:1px solid #dcdad3;transform:rotate(45deg)}
.zonetag{font:600 12px Inter,sans-serif;color:#55534d;background:rgba(255,255,255,.9);border:1px solid #dcdad3;border-radius:7px;padding:3px 9px;pointer-events:auto;cursor:pointer}
.zonetag.meet{color:#fff;border-color:transparent}
#feed div{font-size:12px;color:#55534d;padding:5px 0;border-top:1px solid #efede7;line-height:1.35}
#feed div:first-child{border-top:0}
#feed b{font-weight:500;color:#37352F}
#feed time{color:#9B9A97;font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
.think{display:flex;gap:3px;margin-left:2px}
.think i{width:4px;height:4px;border-radius:50%;background:var(--run);animation:th 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes th{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (max-width:860px){.stage{height:calc(100vh - 120px)}#vside{width:220px}#vdetail{left:12px;right:12px;width:auto;top:auto;bottom:60px}}
#login{position:fixed;inset:0;background:#F7F7F5;display:grid;place-items:center;z-index:100}
.login-card{width:min(360px,92vw);background:#fff;border:1px solid #E9E9E7;border-radius:8px;padding:24px;display:grid;gap:10px}
.login-card .f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#787774}
.login-card .f input{border:1px solid #DFDFDD;border-radius:6px;padding:8px 10px;font-size:14px;color:#37352F;width:100%}
.login-card h1{margin:0;font-size:20px}.login-card p{margin:0;color:#787774;font-size:13.5px}
.login-card .ws{display:flex;align-items:center;gap:8px;font-weight:600}.login-card .ws i{width:22px;height:22px;border-radius:5px;background:#37352F;color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
</style>

<script>
/* đăng nhập và kiểm tra quyền giống trang To do; xong thì giao dữ liệu cho phần 3D */
(function(){
var $=function(s){return document.querySelector(s)};
function loginScreen(sb){
  return new Promise(function(resolve){
    var box=document.createElement("div");box.id="login";
    box.innerHTML='<form id="loginform" class="login-card"><div class="ws"><i>H</i>Huy Tim</div><h1>Đăng nhập</h1><p>Văn phòng Agent chỉ dành cho chủ hệ thống.</p><label class="f">Email<input id="loginemail" type="email" required autocomplete="username"></label><label class="f">Mật khẩu<input id="loginpw" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Đăng nhập</button><p id="loginmsg" role="status"></p></form>';
    document.body.appendChild(box);
    $("#loginform").addEventListener("submit",async function(e){
      e.preventDefault();$("#loginmsg").textContent="Đang đăng nhập...";
      var res=await sb.auth.signInWithPassword({email:$("#loginemail").value.trim(),password:$("#loginpw").value});
      if(res.error)$("#loginmsg").textContent="Sai email hoặc mật khẩu.";
    });
    sb.auth.onAuthStateChange(function(ev,session){if(session)setTimeout(function(){box.remove();resolve(session)},0)});
  });
}
HT.render({base:"../",active:"vanphong"});
window.OFFICE_READY=(async function(){
  var cfg=window.TIMUS_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl){$("#msg").textContent="Chưa tải được thư viện kết nối. Tải lại trang.";return null}
  var sb=window.supabase.createClient(cfg.supabaseUrl,cfg.anonKey,{auth:{persistSession:true,detectSessionInUrl:true}});
  var cur=await sb.auth.getSession(),session=cur.data&&cur.data.session;
  if(!session)session=await loginScreen(sb);
  var email=String(session.user.email||"").toLowerCase();
  HT.render({base:"../",active:"vanphong",user:{email:email,actions:[{icon:"out",label:"Đăng xuất",attrs:"data-ht-signout"}]}});
  HT.onSignout=async function(){await sb.auth.signOut();location.reload()};
  var r=await sb.from("core_roles").select("area,role").eq("email",email);
  var owner=!r.error&&(r.data||[]).some(function(x){return x.area==="all"&&x.role==="owner"});
  if(!owner){$("#msg").innerHTML='<p class="empty" style="font-size:15px">Tài khoản này không có quyền xem Văn phòng Agent.</p>';return null}
  $("#stage").hidden=false;
  return sb;
})();
})();
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const sb = await window.OFFICE_READY;
if (sb) start(sb);

async function start(sb){
const stage = document.getElementById("stage");
const COL = {run:"#1d9e75", today:"#c98a1b", idle:"#a9a79f"};
const TXT = {run:"Đang làm việc", today:"Hoạt động hôm nay", idle:"Đang nghỉ"};
const hex = c => "#" + new THREE.Color(c).getHexString();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; };
const parseLocal = s => { const m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(s||""); return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5]) : null; };
const ago = s => { const d = parseLocal(s); if (!d) return ""; const m = Math.round((Date.now() - d)/60000);
  if (m < 1) return "vừa xong"; if (m < 60) return m+" phút trước"; if (m < 1440) return Math.round(m/60)+" giờ trước"; return Math.round(m/1440)+" ngày trước"; };
let stateOf = a => a.running ? "run" : (a.last && a.last.startsWith(todayStr()) ? "today" : "idle");

/* ---------- Renderer ---------- */
const W = () => stage.clientWidth, H = () => stage.clientHeight;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);
const labels = new CSS2DRenderer();
Object.assign(labels.domElement.style, {position:"absolute", top:"0", left:"0", pointerEvents:"none", zIndex:"1"});
stage.insertBefore(labels.domElement, renderer.domElement.nextSibling);

const scene = new THREE.Scene();
const DAY_BG = new THREE.Color(0xecebe6), NIGHT_BG = new THREE.Color(0x1b1d22);
scene.background = DAY_BG.clone(); scene.fog = new THREE.Fog(0xecebe6, 110, 220);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .07; controls.maxPolarAngle = 1.32; controls.minDistance = 8; controls.maxDistance = 160;
const hemi = new THREE.HemisphereLight(0xffffff, 0xcfcac0, .5); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e6, 1.5); sun.position.set(40,70,30); sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096); sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
Object.assign(sun.shadow.camera, {left:-80,right:80,top:80,bottom:-80,near:1,far:220}); scene.add(sun);

const M = (color, o={}) => new THREE.MeshStandardMaterial({color, roughness:.75, metalness:0, ...o});
function canvasTex(w, h, draw, repeat){ const c = document.createElement("canvas"); c.width=w; c.height=h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); } return t; }
const woodTex = canvasTex(512, 512, (g,w,h) => {
  g.fillStyle = "#d9c4a3"; g.fillRect(0,0,w,h);
  for (let y=0; y<h; y+=32) for (let x=-((y/32)%2)*128; x<w; x+=256){
    const v = 200 + Math.random()*30|0; g.fillStyle = `rgb(${v+18},${v-2},${v-34})`; g.fillRect(x+1,y+1,254,30);
    g.strokeStyle = "rgba(120,90,60,.08)"; for (let k=0;k<5;k++){ g.beginPath(); g.moveTo(x, y+6+Math.random()*20); g.bezierCurveTo(x+80,y+Math.random()*30,x+160,y+Math.random()*30,x+256,y+6+Math.random()*20); g.stroke(); } }
}, [3,3]);
const MAT = {
  wood:M(0xffffff,{map:woodTex,roughness:.62}), wall:M(0xf7f6f2,{roughness:.9}), desk:M(0xf3efe7,{roughness:.5}), deskWood:M(0xc9a77c,{roughness:.55}),
  metal:M(0x3a3a38,{roughness:.35,metalness:.7}), chrome:M(0xb9b9b5,{roughness:.25,metalness:.9}), dark:M(0x2a2a29,{roughness:.5}),
  fabric:M(0x3d3f44,{roughness:.95}), pants:M(0x34363c,{roughness:.9}), pot:M(0xe9e6df,{roughness:.6}), leaf:M(0x4f7a46,{roughness:.8,flatShading:true}),
  glass:new THREE.MeshPhysicalMaterial({color:0xdfeaf0,transparent:true,opacity:.18,roughness:.05,side:THREE.DoubleSide}), ground:M(0xe3e1da,{roughness:1}),
};
const mesh = (geo, mat, x=0, y=0, z=0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; return m; };
const rbox = (w,h,d,r=.06) => new RoundedBoxGeometry(w,h,d,3,r);
const ground = mesh(new THREE.CircleGeometry(240, 64), MAT.ground); ground.rotation.x = -Math.PI/2; ground.castShadow = false; scene.add(ground);

function plant(scale=1){ const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(.42,.32,.8,20), MAT.pot, 0,.4,0));
  for (let i=0;i<6;i++) g.add(mesh(new THREE.IcosahedronGeometry(.42+Math.random()*.2,0), MAT.leaf, (Math.random()-.5)*.6, 1.1+Math.random()*.9, (Math.random()-.5)*.6));
  g.scale.setScalar(scale); return g; }
const CG = {seat:rbox(1.05,.16,1,.07), back:rbox(1.0,1.0,.14,.07), pole:new THREE.CylinderGeometry(.06,.06,.36,10), leg:new THREE.BoxGeometry(.08,.06,.55), wheel:new THREE.SphereGeometry(.07,8,8)};
function chair(){ const g = new THREE.Group();
  g.add(mesh(CG.seat, MAT.fabric, 0,.62,0)); g.add(mesh(CG.back, MAT.fabric, 0,1.2,.48));
  g.add(mesh(CG.pole, MAT.chrome, 0,.38,0));
  for (let i=0;i<5;i++){ const a = i/5*Math.PI*2; const leg = mesh(CG.leg, MAT.chrome, Math.sin(a)*.27,.16,Math.cos(a)*.27); leg.rotation.y = a; g.add(leg);
    g.add(mesh(CG.wheel, MAT.dark, Math.sin(a)*.52,.08,Math.cos(a)*.52)); }
  return g; }
function screenTex(state, color){
  const c = document.createElement("canvas"); c.width = 256; c.height = 160;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = {c, g:c.getContext("2d"), t, state, color, off:0, lines:Array.from({length:40}, () => ({ind:(Math.random()*4|0)*14, w:30+Math.random()*150, c:Math.random()}))};
  drawScreen(s); return s; }
function drawScreen(s){
  const {g} = s;
  if (s.state === "idle"){ g.fillStyle = "#16171a"; g.fillRect(0,0,256,160); s.t.needsUpdate = true; return; }
  g.fillStyle = "#1c1e24"; g.fillRect(0,0,256,160); g.fillStyle = "#262931"; g.fillRect(0,0,256,16); g.fillRect(0,16,40,160);
  ["#e5534b","#d9a43b","#57ab5a"].forEach((col,i)=>{ g.fillStyle = col; g.beginPath(); g.arc(9+i*10,8,3,0,7); g.fill(); });
  for (let i=0;i<8;i++){ g.fillStyle = i===2 ? s.color : "rgba(255,255,255,.12)"; g.fillRect(8,26+i*14,24,6); }
  const start = Math.floor(s.off);
  for (let i=0;i<15;i++){ const L = s.lines[(start+i)%s.lines.length], y = 22 + i*9 - (s.off%1)*9; if (y < 18) continue;
    g.fillStyle = L.c < .3 ? s.color : L.c < .55 ? "#8fb4e0" : L.c < .75 ? "#d6b26a" : "rgba(255,255,255,.45)";
    g.fillRect(48 + L.ind, y, L.w * (s.state==="today" ? .8 : 1), 4); }
  s.t.needsUpdate = true; }
const HAIR = [0x2b2420,0x4a3426,0x1d1b1a,0x6b4a32], SKIN = [0xf0d2b6,0xe6c09c,0xd9ab84];
const PG = { torso:new THREE.CapsuleGeometry(.38,.6,6,16), head:new THREE.SphereGeometry(.32,24,18), hair:new THREE.SphereGeometry(.335,24,18,0,Math.PI*2,0,Math.PI*.55),
  upper:new THREE.CapsuleGeometry(.12,.38,4,10), fore:new THREE.CapsuleGeometry(.1,.34,4,10), hand:new THREE.SphereGeometry(.1,10,10),
  thigh:new THREE.CapsuleGeometry(.15,.4,4,10), shin:new THREE.CapsuleGeometry(.13,.4,4,10), shoe:rbox(.24,.14,.4,.05), cup:new THREE.CylinderGeometry(.1,.08,.24,12),
  hairLong:new THREE.CapsuleGeometry(.25,.32,4,12), bun:new THREE.SphereGeometry(.16,14,12), lens:new THREE.TorusGeometry(.085,.018,6,16), badge:rbox(.16,.22,.03,.02) };
/* người có khớp: hông, gối, vai, khuỷu. Gốc ở mặt sàn, mặt hướng -z. opt: hair (0 ngắn, 1 dài, 2 búi, 3 ngắn), glasses, badge (màu thẻ đeo) */
function person(shirtColor, seed, opt={}){
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const shirt = M(shirtColor,{roughness:.85}), skin = M(SKIN[seed%3]), hairMat = M(HAIR[seed%4],{roughness:.9});
  const torso = mesh(PG.torso, shirt, 0,1.8,0); body.add(torso);
  const head = new THREE.Group(); head.position.set(0,2.85,0); head.add(mesh(PG.head, skin));
  const hair = mesh(PG.hair, hairMat, 0,.03,.03); hair.rotation.x = .25; head.add(hair); body.add(head);
  const hv = opt.hair ?? seed % 4;
  if (hv === 1) head.add(mesh(PG.hairLong, hairMat, 0,-.22,.17));
  if (hv === 2) head.add(mesh(PG.bun, hairMat, 0,.24,.25));
  if (opt.glasses ?? (seed % 5 === 2)) [-.12,.12].forEach(x => head.add(mesh(PG.lens, MAT.dark, x,.03,-.3)));
  if (opt.badge !== undefined) body.add(mesh(PG.badge, M(opt.badge,{roughness:.5}), .18,1.98,-.38));
  const legs = [-.18,.18].map(x => { const hip = new THREE.Group(); hip.position.set(x,1.25,0);
    hip.add(mesh(PG.thigh, MAT.pants, 0,-.3,0)); const knee = new THREE.Group(); knee.position.set(0,-.6,0);
    knee.add(mesh(PG.shin, MAT.pants, 0,-.3,0)); knee.add(mesh(PG.shoe, MAT.dark, 0,-.6,-.08)); hip.add(knee); body.add(hip); return {hip, knee}; });
  const arms = [-.5,.5].map(x => { const sh = new THREE.Group(); sh.position.set(x,2.2,0);
    sh.add(mesh(PG.upper, shirt, 0,-.25,0)); const el = new THREE.Group(); el.position.set(0,-.5,0);
    el.add(mesh(PG.fore, skin, 0,-.22,0)); el.add(mesh(PG.hand, skin, 0,-.47,0)); sh.add(el); body.add(sh); return {sh, el}; });
  const cup = mesh(PG.cup, M(0xffffff,{roughness:.4}), 0,-.55,-.08); cup.visible = false; arms[1].el.add(cup);
  return {root, body, torso, head, legs, arms, cup}; }

/* ---------- Dựng văn phòng từ dữ liệu (gọi lại mỗi khi dữ liệu đổi) ---------- */
const ROOM = 18, GAP = 4;
let office = null, workers = {}, rooms = {}, links = [], pickables = [], ALL = [], DEPTS = [], selected = null;

function build(depts, snapshotAt){
  if (office){ scene.remove(office); office.traverse(o => { o.geometry?.dispose(); if (o.material && !Object.values(MAT).includes(o.material)) o.material.dispose?.(); }); }
  office = new THREE.Group(); scene.add(office);
  workers = {}; rooms = {}; links = []; pickables = [];
  DEPTS = depts; ALL = depts.flatMap(d => d.agents.map(a => ({...a, dept:d})));

  const snap = snapshotAt ? new Date(snapshotAt) : null, stale = !snap || Date.now() - snap > 2*3600e3;
  document.getElementById("live").classList.toggle("old", stale);
  document.getElementById("stamp").textContent = snap ? `Cập nhật ${snap.toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"})}${stale ? " · dữ liệu cũ" : " · tự cập nhật"}` : "Chưa có dữ liệu";
  const cnt = s => ALL.filter(a => stateOf(a) === s).length;
  document.getElementById("kpis").innerHTML = [["Nhân viên", ALL.length, "#37352F"], ["Đang làm", cnt("run"), COL.run], ["Hôm nay", cnt("today"), COL.today], ["Nghỉ", cnt("idle"), COL.idle]]
    .map(([l,v,c]) => `<div class="kpi"><b style="color:${c}">${v}</b><span>${l}</span></div>`).join("");
  document.getElementById("depts").innerHTML = depts.map(d => {
    const n = d.agents.length || 1, r = d.agents.filter(a=>stateOf(a)==="run").length, t = d.agents.filter(a=>stateOf(a)==="today").length;
    return `<button class="dept" data-room="${esc(d.id)}"><div class="top"><span class="vsw" style="background:${hex(d.color)}"></span>${esc(d.name)}<span class="n">${r?`<span style="color:${COL.run}">${r} đang làm</span> · `:""}${d.agents.length}</span></div>
    <div class="bar"><i style="width:${r/n*100}%;background:${COL.run}"></i><i style="width:${t/n*100}%;background:${COL.today}"></i><i style="width:${(d.agents.length-r-t)/n*100}%;background:#d6d4cc"></i></div></button>`;
  }).join("");

  const topCount = Math.ceil(depts.length/2);
  depts.forEach((d, i) => {
    const row = i < topCount ? 0 : 1, count = row ? depts.length - topCount : topCount, k = row ? i - topCount : i;
    const cx = (k - (count-1)/2) * (ROOM+GAP), cz = (row - .5) * (ROOM+GAP);
    const room = new THREE.Group(); room.position.set(cx,0,cz); office.add(room);
    const tint = new THREE.Color(d.color); rooms[d.id] = {center:new THREE.Vector3(cx,0,cz), cx, cz, row, laneZ: row ? cz+ROOM/2+2.5 : cz+ROOM/2+2, doorZ: cz+ROOM/2+1.2};
    room.add(mesh(new THREE.BoxGeometry(ROOM,.3,ROOM), MAT.wood, 0,.15,0));
    const rug = mesh(rbox(ROOM-5,.04,ROOM-6,.02), M(tint.clone().lerp(new THREE.Color(0xffffff),.78),{roughness:1}), .5,.32,1); rug.castShadow = false; room.add(rug);
    room.add(mesh(new THREE.BoxGeometry(ROOM,.06,.35), M(d.color,{roughness:.6}), 0,.33,ROOM/2-.18));
    const wallH = 3.6;
    room.add(mesh(new THREE.BoxGeometry(ROOM,wallH,.3), MAT.wall, 0,wallH/2+.3,-ROOM/2+.15));
    room.add(mesh(new THREE.BoxGeometry(.3,wallH,ROOM), MAT.wall, -ROOM/2+.15,wallH/2+.3,0));
    room.add(mesh(new THREE.BoxGeometry(ROOM+.02,.14,.34), M(d.color,{roughness:.5}), 0,wallH+.37,-ROOM/2+.15));
    room.add(mesh(new THREE.BoxGeometry(.34,.14,ROOM+.02), M(d.color,{roughness:.5}), -ROOM/2+.15,wallH+.37,0));
    const glass = mesh(new THREE.BoxGeometry(.08,2.6,ROOM*.62), MAT.glass, ROOM/2-.1,1.6,-ROOM*.19); glass.castShadow = false; room.add(glass);
    room.add(mesh(new THREE.BoxGeometry(.12,2.6,.12), MAT.chrome, ROOM/2-.1,1.6,-ROOM/2+.3));
    room.add(mesh(new THREE.BoxGeometry(.12,2.6,.12), MAT.chrome, ROOM/2-.1,1.6,ROOM*.12));
    room.add(mesh(new THREE.BoxGeometry(.12,.12,ROOM*.62), MAT.chrome, ROOM/2-.1,2.9,-ROOM*.19));

    const n = d.agents.length, r = d.agents.filter(a=>stateOf(a)==="run").length, t = d.agents.filter(a=>stateOf(a)==="today").length;
    const board = canvasTex(1024, 384, (g,w) => {
      g.fillStyle = "#fff"; g.fillRect(0,0,w,384); g.fillStyle = hex(d.color); g.fillRect(0,0,w,14);
      g.fillStyle = "#1f1f1d"; g.font = "600 64px Inter, -apple-system, sans-serif"; g.fillText(d.name, 48, 112);
      g.fillStyle = "#76746d"; g.font = "400 30px Inter, -apple-system, sans-serif"; g.fillText(`${n} nhân viên`, 48, 160);
      [[r,"Đang làm",COL.run],[t,"Hôm nay",COL.today],[n-r-t,"Nghỉ",COL.idle]].forEach(([v,l,c],j) => { const x = 48 + j*300;
        g.fillStyle = c; g.font = "600 92px Inter, -apple-system, sans-serif"; g.fillText(v, x, 300);
        g.fillStyle = "#76746d"; g.font = "400 30px Inter, -apple-system, sans-serif"; g.fillText(l, x, 345); }); });
    const bm = mesh(new THREE.PlaneGeometry(6.4,2.4), new THREE.MeshStandardMaterial({map:board,roughness:.6}), -2.6,2.35,-ROOM/2+.34); bm.castShadow = false; room.add(bm);
    room.add(mesh(new THREE.BoxGeometry(6.6,2.6,.06), MAT.dark, -2.6,2.35,-ROOM/2+.3));
    [[1.2,-ROOM/2+1.2,-ROOM/2+1.2],[.9,-ROOM/2+1.2,ROOM/2-1.4],[1.05,5.6,-ROOM/2+1.1]].forEach(([s,x,z]) => { const p = plant(s); p.position.set(x,.3,z); room.add(p); });
    const tagEl = document.createElement("div"); tagEl.className = "roomtag"; tagEl.style.background = hex(d.color); tagEl.textContent = d.name;
    tagEl.onclick = () => { stopTour(); focusRoom(d.id); };
    const rt = new CSS2DObject(tagEl); rt.position.set(0, wallH+1.4, -ROOM/2); room.add(rt);

    const cols = n > 4 ? 3 : 2, rows = Math.ceil(n/cols), sx = 5.2, sz = rows > 2 ? 4.6 : 5.6;
    d.agents.forEach((a, j) => {
      const rr = Math.floor(j/cols), cc = j%cols, inRow = rr === rows-1 ? n - rr*cols : cols;
      const x = (cc - (inRow-1)/2) * sx, z = (rr - (rows-1)/2) * sz + 1.8, st = stateOf(a), seed = j + i*7;
      const g = new THREE.Group(); g.position.set(x,.3,z); room.add(g);
      g.add(mesh(rbox(3.4,.12,1.7,.05), MAT.desk, 0,1.55,-.55));
      [-1.55,1.55].forEach(px => g.add(mesh(new THREE.BoxGeometry(.1,1.5,1.5), MAT.metal, px,.78,-.55)));
      g.add(mesh(new THREE.BoxGeometry(3.0,.5,.04), MAT.deskWood, 0,1.15,-1.3));
      const sc = screenTex(st, hex(d.color));
      const mon = new THREE.Group(); mon.position.set(0,2.4,-1.05); mon.add(mesh(rbox(1.75,1.08,.08,.03), MAT.dark));
      const scrMat = new THREE.MeshStandardMaterial({map:sc.t, emissive:0xffffff, emissiveMap:sc.t, emissiveIntensity: st==="idle" ? 0 : .9, roughness:.3});
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.64,.98), scrMat); scr.position.z = .045; mon.add(scr);
      mon.add(mesh(new THREE.CylinderGeometry(.04,.04,.55,10), MAT.chrome, 0,-.75,-.05)); mon.add(mesh(rbox(.5,.04,.32,.02), MAT.chrome, 0,-1.02,0));
      mon.rotation.x = -.05; g.add(mon);
      g.add(mesh(rbox(1.1,.04,.36,.02), M(0xe9e8e4,{roughness:.4}), 0,1.63,-.2)); g.add(mesh(rbox(.18,.05,.28,.06), M(0xe9e8e4,{roughness:.4}), .85,1.63,-.2));
      if (seed%3===0) g.add(mesh(new THREE.CylinderGeometry(.11,.09,.26,14), M(seed%2?0xffffff:d.color), -1.25,1.74,-.6));
      if (seed%4===1){ const b = mesh(rbox(.5,.08,.65,.02), M(0xf2efe6), 1.2,1.65,-.75); b.rotation.y = .2; g.add(b); }
      if (a.lead){ const plate = mesh(rbox(.9,.22,.06,.02), M(d.color,{roughness:.4}), -1.0,1.75,-.2); plate.rotation.x = -.35; g.add(plate);
        const rug2 = new THREE.Mesh(new THREE.RingGeometry(1.95,2.05,64), new THREE.MeshBasicMaterial({color:d.color, transparent:true, opacity:.55})); rug2.rotation.x = -Math.PI/2; rug2.position.set(0,.05,.1); g.add(rug2); }
      const ch = chair(); ch.position.set(0,0,.85); g.add(ch);
      const p = person(a.lead ? 0x3b3f46 : tint.clone().lerp(new THREE.Color(0xffffff), st==="idle" ? .55 : .2), seed, {badge:d.color}); office.add(p.root);
      let ring = null, lamp = null;
      if (st === "run"){ ring = new THREE.Mesh(new THREE.RingGeometry(1.7,1.85,64), new THREE.MeshBasicMaterial({color:COL.run, transparent:true, opacity:.6})); ring.rotation.x = -Math.PI/2; ring.position.set(0,.06,.1); g.add(ring); }
      if (st !== "idle"){ lamp = new THREE.PointLight(new THREE.Color(st==="run"?0x9fe1cb:0xffe2b0), 0, 6, 2); lamp.position.set(0,2.6,-.4); g.add(lamp); }
      const el = document.createElement("div"); el.className = "tag" + (st==="idle" ? " dim" : "") + (selected === a.id ? " sel" : "");
      el.innerHTML = `<span class="dot" style="background:${COL[st]}"></span>${esc(a.name)}${st==="run" ? '<span class="think"><i></i><i></i><i></i></span>' : ""}${a.lead && !/trưởng phòng/i.test(a.name) ? '<span class="lead">Trưởng phòng</span>' : ""}<span class="role">· ${esc(a.role)}</span>`;
      el.onclick = e => { e.stopPropagation(); select(a.id); };
      const lab = new CSS2DObject(el); lab.position.set(0,3.65,0); p.root.add(lab);
      const bub = document.createElement("div"); bub.className = "bubble"; const bl = new CSS2DObject(bub); bl.position.set(0,4.35,0); p.root.add(bl);
      workers[a.id] = {a, dept:d, st, g, p, ring, lamp, sc, scrMat, el, bub, dx:x, dz:z, seed, lead:!!a.lead, note:a.note || ""};
      g.traverse(o => { if (o.isMesh){ o.userData.agent = a.id; pickables.push(o); } });
      p.root.traverse(o => { if (o.isMesh){ o.userData.agent = a.id; pickables.push(o); } });
    });
  });
  const maxX = Math.max(...Object.values(rooms).map(r => Math.abs(r.cx))) + ROOM/2;
  buildCommons(maxX);
  if (!homeSet){ homeSet = true; const cx = (LX0 + CX0 + 22)/2;
    HOME.target.set(cx, 0, 0); HOME.pos.set(cx + 50, 84, 104); camera.position.copy(HOME.pos); controls.target.copy(HOME.target); }
  office.updateMatrixWorld(true);
  initLife();
  ALL.forEach(a => {
    if (!a.parent || !workers[a.parent] || !workers[a.id]) return;
    const P = workers[a.parent].g.getWorldPosition(new THREE.Vector3()), Q = workers[a.id].g.getWorldPosition(new THREE.Vector3());
    const mid = P.clone().add(Q).multiplyScalar(.5); mid.y = 7 + P.distanceTo(Q)*.15;
    const curve = new THREE.QuadraticBezierCurve3(P.clone().setY(4.2), mid, Q.clone().setY(4.2));
    office.add(new THREE.Mesh(new THREE.TubeGeometry(curve,60,.045,8), new THREE.MeshBasicMaterial({color:0x9a988f, transparent:true, opacity:.7})));
    const pulses = [0,.5].map(o => { const s = new THREE.Mesh(new THREE.SphereGeometry(.17,16,16), new THREE.MeshBasicMaterial({color:COL.run})); office.add(s); return {s,o}; });
    links.push({curve, pulses});
  });
  if (selected && workers[selected]) showDetail(selected); else if (selected) closeDetail();
}

/* ---------- Khu chung, sảnh, phòng anh Huy, mạng lối đi ---------- */
const V = (x, z) => new THREE.Vector3(x, 0, z);
const yawOf = (dx, dz) => Math.atan2(-dx, -dz);
let SPOTS = [], CONN_X = 0, LEFT_X = 0, CX0 = 0, LX0 = 0, MEET = null, ZONES = {}, DOOR = null, HUY = null;
const LANE = {top:0, bot:22.5};
const tileTex = canvasTex(256, 256, (g,w,h) => { g.fillStyle = "#eeece6"; g.fillRect(0,0,w,h); g.strokeStyle = "rgba(0,0,0,.06)"; g.lineWidth = 2;
  for (let i=0;i<=w;i+=64){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,h); g.stroke(); g.beginPath(); g.moveTo(0,i); g.lineTo(w,i); g.stroke(); } }, [11,21]);
function zoneTag(text, x, z, focus, y=4.4){ const el = document.createElement("div"); el.className = "zonetag"; el.textContent = text;
  el.onclick = () => { stopTour(); focusRoom(focus); };
  const o = new CSS2DObject(el); o.position.set(x, y, z); office.add(o); return el; }
function addSpot(kind, x, z, dx, dz, pose, zone, back=1){
  const s = {kind, pos:V(x, z), approach:V(x - dx*back, z - dz*back), yaw:yawOf(dx, dz), pose, zone, busy:null}; SPOTS.push(s); return s; }
function sofa(cx, cz, w, d, rot, color=0x6f7c86){ const g = new THREE.Group(); g.position.set(cx, .3, cz); g.rotation.y = rot; const m = M(color,{roughness:.95});
  g.add(mesh(rbox(w,.6,d,.12), m, 0,.3,0)); g.add(mesh(rbox(w,1.1,.4,.12), m, 0,.85,d/2-.2));
  [-1,1].forEach(k => g.add(mesh(rbox(.35,.85,d,.1), m, k*(w/2-.17),.42,0))); office.add(g); }
function strip(x, z, w, d, mat){ const m = mesh(new THREE.BoxGeometry(w,.3,d), mat, x,.15,z); m.castShadow = false; office.add(m); }
function signTex(title, sub, color){ return canvasTex(1024, 320, (g,w,h) => { g.fillStyle = "#ffffff"; g.fillRect(0,0,w,h); g.fillStyle = color; g.fillRect(0,0,22,h);
  g.fillStyle = "#1f1f1d"; g.font = "700 120px Inter, -apple-system, sans-serif"; g.fillText(title, 70, 170);
  g.fillStyle = "#76746d"; g.font = "400 46px Inter, -apple-system, sans-serif"; g.fillText(sub, 74, 250); }); }

function buildCommons(maxX){
  SPOTS = []; ZONES = {}; CONN_X = maxX + 2.5; CX0 = maxX + 5; LEFT_X = -maxX - 2.5; LX0 = -maxX - 14;
  const X = v => CX0 + v, L = v => LX0 + v;
  const walk = M(0xd9d5cb,{roughness:.95});
  strip((L(0) + CONN_X + 1.7)/2, LANE.top, CONN_X + 1.7 - L(0), 4, walk);
  strip((LEFT_X - 1.7 + CONN_X + 1.7)/2, LANE.bot, CONN_X - LEFT_X + 3.4, 3.4, walk);
  strip(CONN_X, 1.35, 3.4, 45.7, walk);
  { const m = mesh(new THREE.BoxGeometry(3.4,.29,22.4), walk, LEFT_X,.145,12.4); m.castShadow = false; office.add(m); }
  /* nền và tường khu chung */
  const fl = mesh(new THREE.BoxGeometry(22,.3,42), M(0xffffff,{map:tileTex,roughness:.7}), X(11),.15,0); fl.castShadow = false; office.add(fl);
  office.add(mesh(new THREE.BoxGeometry(22,3.6,.3), MAT.wall, X(11),2.1,-21.15));
  office.add(mesh(new THREE.BoxGeometry(.3,3.6,42), MAT.wall, X(22.15),2.1,0));
  office.add(mesh(new THREE.BoxGeometry(22.3,.14,.34), M(0x9a988f), X(11),3.97,-21.15));
  office.add(mesh(new THREE.BoxGeometry(.34,.14,42.3), M(0x9a988f), X(22.15),3.97,0));

  /* Pantry */
  ZONES.pantry = {node:{line:"conn", c:-13.5}, inPts:[V(X(1.6), -13.5)]};
  office.add(mesh(rbox(1.4,1.5,10,.04), M(0xe8e4dc,{roughness:.6}), X(20.6),1.05,-14));
  office.add(mesh(rbox(1.5,.08,10.1,.02), M(0x3a3a38,{roughness:.4}), X(20.6),1.84,-14));
  office.add(mesh(rbox(.8,.95,.7,.06), MAT.dark, X(20.6),2.35,-16.5));
  office.add(mesh(rbox(.7,.55,.6,.06), M(0xb9b9b5,{metalness:.6,roughness:.3}), X(20.6),2.15,-13.2));
  office.add(mesh(rbox(1.4,3,1.3,.06), M(0xdfe3e6,{roughness:.3,metalness:.3}), X(20.6),1.8,-7.8));
  [-17,-14.5,-12].forEach(z => addSpot("coffee", X(19.25), z, 1, 0, "stand", ZONES.pantry, 1.4));
  [[X(7.5),-16],[X(12.5),-11]].forEach(([tx,tz]) => {
    office.add(mesh(new THREE.CylinderGeometry(.85,.85,.1,28), M(0xf3efe7,{roughness:.5}), tx,1.75,tz));
    office.add(mesh(new THREE.CylinderGeometry(.07,.07,1.4,10), MAT.chrome, tx,1.0,tz));
    office.add(mesh(new THREE.CylinderGeometry(.45,.45,.06,20), MAT.chrome, tx,.33,tz));
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([ox,oz]) => addSpot("table", tx+ox*1.3, tz+oz*1.3, -ox, -oz, "stand", ZONES.pantry, 1)); });
  [[X(3),-19.5],[X(16),-19.6]].forEach(([x,z]) => { const pl = plant(1.1); pl.position.set(x,.3,z); office.add(pl); });
  zoneTag("Pantry", X(11), -13, "commons");

  /* Phòng họp */
  ZONES.meet = {node:{line:"conn", c:1}, inPts:[V(X(1.6), 1)]};
  const gl = (w,d,x,z) => { const m = mesh(new THREE.BoxGeometry(w,2.6,d), MAT.glass, x,1.6,z); m.castShadow = false; office.add(m); };
  gl(21,.08, X(11.5),-5); gl(21,.08, X(11.5),7); gl(.08,4.8, X(1),-2.6); gl(.08,4.8, X(1),4.6);
  [[X(1),-5],[X(1),7],[X(1),-.2],[X(1),2.2]].forEach(([x,z]) => office.add(mesh(new THREE.BoxGeometry(.12,2.6,.12), MAT.chrome, x,1.6,z)));
  office.add(mesh(rbox(9,.14,2.6,.05), MAT.deskWood, X(12),1.75,1));
  [X(8.3),X(15.7)].forEach(x => office.add(mesh(new THREE.BoxGeometry(.2,1.4,1.8), MAT.dark, x,1.0,1)));
  office.add(mesh(rbox(.12,1.7,3.2,.03), MAT.dark, X(21.8),2.4,1));
  const seats = [];
  [X(8.6),X(12),X(15.4)].forEach(x => { seats.push([x, 1+2.15, 0,-1]); seats.push([x, 1-2.15, 0, 1]); });
  seats.push([X(6.6),1, 1,0]); seats.push([X(17.4),1, -1,0]);
  seats.forEach(([x,z,dx,dz]) => { const c = chair(); c.position.set(x,.3,z); c.rotation.y = yawOf(dx,dz); office.add(c); addSpot("meet", x, z, dx, dz, "sit", ZONES.meet, 1.1); });
  const meetEl = zoneTag("Phòng họp", X(11), 1, "commons");

  /* Lounge, bàn ăn trưa */
  ZONES.lounge = {node:{line:"conn", c:14.5}, inPts:[V(X(1.6), 14.5)]};
  office.add(mesh(rbox(10,.04,8,.02), M(0xd9d2c3,{roughness:1}), X(14),.33,14.5));
  sofa(X(20.6), 14.5, 6.4, 1.6, -Math.PI/2);
  sofa(X(13), 19.7, 6.4, 1.6, Math.PI);
  [12.6,14.5,16.4].forEach(z => addSpot("sofa", X(20.1), z, -1, 0, "sit", ZONES.lounge, 1.3));
  [X(11.1),X(13),X(14.9)].forEach(x => addSpot("sofa", x, 19.2, 0, -1, "sit", ZONES.lounge, 1.3));
  office.add(mesh(rbox(3,.12,2,.04), MAT.deskWood, X(14.5),.95,14.2));

/* ---------- Mạng lối đi: các đường top, bot, conn, left ---------- */
const JUNC = {"top|conn":[()=>CONN_X, ()=>LANE.top], "bot|conn":[()=>CONN_X, ()=>LANE.bot], "top|left":[()=>LEFT_X, ()=>LANE.top], "bot|left":[()=>LEFT_X, ()=>LANE.bot]};
function junction(a, b){ const k1 = a + "|" + b, k2 = b + "|" + a;
  if (JUNC[k1]) return [JUNC[k1][0](), JUNC[k1][1]()]; if (JUNC[k2]) return [JUNC[k2][1](), JUNC[k2][0]()]; return null; }
function linePt(n, o){ if (n.line === "top") return V(n.c, LANE.top + o); if (n.line === "bot") return V(n.c, LANE.bot + o*.6);
  if (n.line === "conn") return V(CONN_X + o*.6, n.c); return V(LEFT_X + o*.6, n.c); }
function travel(a, b, o){
  if (a.line === b.line) return [linePt(b, o)];
  const j = junction(a.line, b.line);
  if (j) return [linePt({line:a.line, c:j[0]}, o), linePt(b, o)];
  let best = null;
  ["top","bot","conn","left"].forEach(mid => { const j1 = junction(a.line, mid), j2 = junction(mid, b.line); if (!j1 || !j2) return;
    const len = Math.abs(a.c - j1[0]) + Math.abs(j1[1] - j2[0]) + Math.abs(j2[1] - b.c);
    if (!best || len < best.len) best = {len, pts:[linePt({line:a.line, c:j1[0]}, o), linePt({line:mid, c:j2[0]}, o), linePt(b, o)]}; });
  return best ? best.pts : [linePt(b, o)];
}

function clockMin(){ if (warp) return warpMin; const d = new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; }
function phaseOf(m){ return m < 420 || m >= 1320 ? "night" : m < 510 ? "morning" : m < 720 ? "work" : m < 810 ? "lunch" : m < 1080 ? "work" : "evening"; }
function hhmm(m){ return `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(Math.floor(m%60)).padStart(2,"0")}`; }
function present(w, m){
  if (w.st === "run") return true;

  const leave = w.lead ? 1170 + w.jit : w.st === "today" ? 1080 + w.jit*1.5 : 1050 + w.jit;

}

function deskPts(w){ const r = rooms[w.dept.id], x = r.cx + w.dx, z = r.cz + w.dz;
  return {seat:V(x, z+.85), aisle:V(x, z+2.45), visit:V(x+1.95, z+.35), visitAisle:V(x+1.95, z+2.45), gx:x+2.6, room:r}; }
const roomOf = loc => loc.type === "seat" || loc.type === "visit" ? loc.w.dp.room : null;
function finalOf(loc){ if (loc.type === "seat") return loc.w.dp.seat; if (loc.type === "visit") return loc.w.dp.visit; if (loc.type === "door") return DOOR; return loc.s.pos; }
function aisleOf(loc){ return loc.type === "seat" ? loc.w.dp.aisle : loc.w.dp.visitAisle; }
function exitOf(loc){
  if (loc.type === "seat" || loc.type === "visit"){ const r = roomOf(loc), g = loc.w.dp.gx, a = aisleOf(loc);
    return {pts:[a, V(g, a.z), V(g, r.doorZ)], node:{line: r.row ? "bot" : "top", c:g}}; }
  if (loc.type === "door") return {pts:[], node:ZONES.lobby.node};
  const z = loc.s.zone; return {pts:[loc.s.approach, ...[...z.inPts].reverse()], node:z.node};
}
function enterOf(loc){
  if (loc.type === "seat" || loc.type === "visit"){ const r = roomOf(loc), g = loc.w.dp.gx, a = aisleOf(loc);
    return {pts:[V(g, r.doorZ), V(g, a.z), a, finalOf(loc)], node:{line: r.row ? "bot" : "top", c:g}}; }
  if (loc.type === "door") return {pts:[DOOR], node:ZONES.lobby.node};
  const z = loc.s.zone; return {pts:[...z.inPts, loc.s.approach, loc.s.pos], node:z.node};
}
function route(from, to, w){
  const rf = roomOf(from), rt = roomOf(to);
  if (rf && rf === rt){ const a = aisleOf(from), b = aisleOf(to), g = from.w.dp.gx; return [a, V(g, a.z), V(g, b.z), b, finalOf(to)]; }
  if (from.type === "spot" && to.type === "spot" && from.s.zone === to.s.zone) return [from.s.approach, to.s.approach, to.s.pos];
  const ex = exitOf(from), en = enterOf(to), o = w.off;
  return [...ex.pts, linePt(ex.node, o), ...travel(ex.node, en.node, o), ...en.pts];
}
function say(w, text, dur=3.6){ if (!text) return; w.bub.textContent = text; w.bub.classList.add("on"); w.bubUntil = simT + dur; }
function pushFeed(html){ const tm = hhmm(clockMin());
  feedItems.unshift(`<div><time>${tm}</time>${html}</div>`); feedItems = feedItems.slice(0, 7);
  const f = document.getElementById("feed"); if (f) f.innerHTML = feedItems.join(""); }
const nmPlain = w => w.a.lead ? "Trưởng phòng " + w.dept.name : w.a.name;
const nm = w => `<b>${esc(nmPlain(w))}</b>`;
function doing(w){

  if (w.mode === "walk"){ const n = w.next; if (!n) return "Đang đi";

      sofa:"Đang ra lounge", lunch:"Đang đi ăn trưa", report:"Đang lên báo cáo anh Huy", home:"Đang tan làm"})[n.act] || "Đang đi dạo"; }
  return ({desk: w.st === "run" ? "Đang làm việc tại bàn" + (phaseOf(clockMin()) === "night" ? " (làm đêm)" : "") : w.st === "today" ? "Đang ở bàn làm việc" : "Ngồi nghỉ tại bàn",
    visit:"Đang trao đổi ở bàn " + (w.loc.w ? nmPlain(w.loc.w) : ""), coffee:"Đang pha cà phê", table:"Đang nói chuyện ở pantry",
    sofa:"Đang nghỉ ở lounge", window:"Đang đứng nghỉ ở lounge", meet:"Đang họp phòng " + (MEET && MEET.dept ? MEET.dept.name : w.dept.name),
    lunch:"Đang ăn trưa", report:"Đang báo cáo anh Huy"})[w.act] || "";
}
function teammates(w){ return Object.values(workers).filter(x => x !== w && x.dept === w.dept && x.mode !== "home" && !x.leaving); }
function freeSpot(kind){ const l = SPOTS.filter(s => s.kind === kind && !s.busy); return l.length ? pick(l) : null; }

function goTo(w, loc, act, dur){
  if (w.loc && w.loc.type === "spot" && w.loc.s.busy === w) w.loc.s.busy = null;
  if (loc.type === "spot") loc.s.busy = w;
  w.path = route(w.loc, loc, w); w.pi = 0; w.mode = "walk"; w.next = {loc, act, dur};
  w.p.cup.visible = false;
}
function settle(w, loc, act, dur){
  w.loc = loc; w.act = act; w.mode = "act"; w.timer = simT + dur;
  const end = finalOf(loc); w.pos.copy(end);
  if (loc.type === "seat") w.yawT = 0;
  else if (loc.type === "visit"){ const d = loc.w.dp.seat.clone().sub(end); w.yawT = yawOf(d.x, d.z); }
  else if (loc.type === "spot") w.yawT = loc.s.yaw;
  w.sit = act === "desk" || (loc.type === "spot" && loc.s.pose === "sit");
}
function arrive(w){
  const n = w.next; w.next = null;
  if (n.act === "home"){ w.loc = {type:"door"}; w.mode = "home"; w.leaving = false; w.p.root.visible = false; w.bub.classList.remove("on"); return; }
  settle(w, n.loc, n.act, n.dur);
  if (n.act === "visit"){ say(w, pick(w.a.lead ? PHR.lead : PHR.visit)); const tw = n.loc.w;
    if (tw.mode === "act" && tw.act === "desk") setTimeout(() => say(tw, pick(PHR.reply)), 1600); }
  else if (n.act === "coffee"){ w.p.cup.visible = true; if (Math.random() < .5) say(w, pick(PHR.coffee)); }
  else if (n.act === "lunch"){ if (Math.random() < .5) say(w, pick(PHR.lunch)); }
  else if (n.act === "report"){ say(w, `Báo cáo anh: ${w.note || "phòng " + w.dept.name + " ổn"}`, 4.5); setTimeout(() => { if (HUY && HUY.p.root.visible) say(HUY, pick(PHR.huy)); }, 2200); }
  else if (n.act === "table" || n.act === "window" || n.act === "sofa"){ if (Math.random() < .55) say(w, pick(PHR[n.act])); }
  else if (n.act === "meet"){ MEET.arrived++; if (MEET.arrived >= MEET.members.length) MEET.endAt = Math.min(MEET.endAt, simT + 22); }
  else if (n.act === "desk" && w.justArrived){ w.justArrived = false; if (Math.random() < .5) say(w, pick(PHR.arrive)); }
  if (w.pendingMeet){ const s = w.pendingMeet; w.pendingMeet = null; goTo(w, {type:"spot", s}, "meet", 1e9); }
  else if (w.backAfterMeet){ w.backAfterMeet = false; goTo(w, {type:"seat", w}, "desk", deskDur(w)); }
}
const deskDur = w => w.lead ? rnd(10,18) : w.st === "run" ? rnd(30,60) : w.st === "today" ? rnd(22,42) : rnd(10,18);

function decide(w){
  const r = Math.random(), mates = teammates(w), home = {type:"seat", w}, ph = phaseOf(clockMin());
  const atDesk = w.loc.type === "seat", stay = () => (w.timer = simT + deskDur(w));
  const visitOf = list => { const seated = list.filter(x => x.mode === "act" && x.act === "desk"); return seated.length ? pick(seated) : null; };
  const toSpot = (kind, dur, label) => { const s = freeSpot(kind); if (!s) return false; goTo(w, {type:"spot", s}, kind, dur);
    if (label) pushFeed(`${nm(w)} ${label}`); return true; };
  if (ph === "lunch" && w.st !== "run"){
    if (["lunch","sofa","table"].includes(w.act) && !atDesk) return (w.timer = simT + rnd(20,40));
    if (toSpot("lunch", rnd(30,60), "đi ăn trưa") || toSpot("table", rnd(25,45)) || toSpot("sofa", rnd(25,45))) return;
    return stay();
  }
  if (ph === "night"){ if (!atDesk) return goTo(w, home, "desk", deskDur(w)); if (r < .12 && toSpot("coffee", rnd(6,9))) return; if (r < .3) say(w, w.note || pick(PHR.late), 4); return stay(); }
  if (!atDesk){
    const back = w.lead ? .8 : w.st === "run" ? .95 : w.st === "today" ? .75 : .35;
    if (r < back) return goTo(w, home, "desk", deskDur(w));
    if (toSpot(pick(["sofa","table","coffee","window"]), rnd(9,18))) return;
    return goTo(w, home, "desk", deskDur(w));
  }
  if (w.lead){
    if (r < .14 && ph === "work" && HUY && HUY.p.root.visible){ const s = freeSpot("report"); if (s){ goTo(w, {type:"spot", s}, "report", rnd(8,11)); pushFeed(`${nm(w)} lên phòng anh Huy báo cáo`); return; } }
    if (r < .6 && mates.length){ w.rr = ((w.rr ?? -1) + 1) % mates.length; const t = mates[w.rr];
      if (t.mode === "act" && t.act === "desk"){ pushFeed(`${nm(w)} ghé bàn ${nm(t)}`); return goTo(w, {type:"visit", w:t}, "visit", rnd(6,9)); } }
    if (r < .72 && toSpot("coffee", rnd(7,10), "ra pantry pha cà phê")) return;
    return stay();
  }
  if (w.st === "run"){
    if (r < .72) return stay();
    if (r < .86){ const linked = mates.filter(x => x.a.id === w.a.parent || x.a.parent === w.a.id);
      const t = visitOf(linked.length ? linked : mates); if (t){ pushFeed(`${nm(w)} sang hỏi ${nm(t)}`); return goTo(w, {type:"visit", w:t}, "visit", rnd(6,9)); } }
    if (toSpot("coffee", rnd(7,10), "đi pha cà phê")) return;
    return stay();
  }
  if (w.st === "today"){
    if (r < .5) return stay();
    if (r < .62 && toSpot("coffee", rnd(7,10), "ra pantry")) return;
    if (r < .72 && toSpot("table", rnd(9,14), "đứng nói chuyện ở pantry")) return;
    if (r < .88){ const t = visitOf(mates); if (t){ pushFeed(`${nm(w)} ghé bàn ${nm(t)}`); return goTo(w, {type:"visit", w:t}, "visit", rnd(6,9)); } }
    if (toSpot("sofa", rnd(10,16), "ra lounge nghỉ")) return;
    return stay();
  }
  if (r < .15) return stay();
  if (r < .55 && toSpot("sofa", rnd(15,30), "ra lounge nghỉ")) return;
  if (r < .75 && toSpot("table", rnd(10,16))) return;
  if (r < .9 && toSpot("coffee", rnd(7,10))) return;
  if (toSpot("window", rnd(8,12))) return;
  stay();
}

    let placed = false;
    if (w.st === "idle" && !w.lead && Math.random() < .55 && phaseOf(m0) !== "night"){ const s = freeSpot(pick(["sofa","sofa","table","window"]));
      if (s){ s.busy = w; settle(w, {type:"spot", s}, s.kind, rnd(4,20)); placed = true; } }
    if (!placed) settle(w, {type:"seat", w}, "desk", w.lead ? rnd(3,8) : rnd(4,25));
    w.yaw = w.yawT;
  });
  makeHuy();
  pushFeed(`Văn phòng lúc ${hhmm(m0)}: ${PHASE_TXT[phaseOf(m0)].toLowerCase()}`);
}

function meetTick(t){
  if (!MEET) return;
  const ph = phaseOf(clockMin());
  if (!MEET.active && t > MEET.next){
    if (ph !== "work"){ MEET.next = t + 20; return; }
    const avail = w => w.mode !== "home" && !w.leaving;
    const cands = DEPTS.map(d => Object.values(workers).filter(w => w.dept.id === d.id && avail(w))).filter(l => l.length >= 3 && l.some(w => w.lead));
    if (!cands.length){ MEET.next = t + 60; return; }
    const team = pick(cands), lead = team.find(w => w.lead), others = team.filter(w => !w.lead).sort(() => Math.random() - .5).slice(0, 3);
    const seats = SPOTS.filter(s => s.kind === "meet" && !s.busy).slice(0, 1 + others.length);
    MEET.members = [lead, ...others].slice(0, seats.length); MEET.arrived = 0; MEET.active = true; MEET.endAt = t + 90; MEET.dept = lead.dept;
    MEET.members.forEach((w, i) => { const s = seats[i]; s.busy = w;
      if (w.mode === "act"){ if (w.loc.type === "spot" && w.loc.s.busy === w) w.loc.s.busy = null; w.path = route(w.loc, {type:"spot", s}, w); w.pi = 0; w.mode = "walk"; w.next = {loc:{type:"spot", s}, act:"meet", dur:1e9}; w.p.cup.visible = false; }
      else w.pendingMeet = s; });
    MEET.el.textContent = `Phòng ${lead.dept.name} đang họp`; MEET.el.classList.add("meet"); MEET.el.style.background = hex(lead.dept.color);
    pushFeed(`${nm(lead)} gọi ${MEET.members.length - 1} người vào phòng họp`);
    say(lead, "Họp nhanh 5 phút nhé");
  }
  if (MEET.active){
    if (Math.random() < .012){ const sitting = MEET.members.filter(w => w.act === "meet" && w.mode === "act"); if (sitting.length) say(pick(sitting), pick(PHR.meet)); }
    if (t > MEET.endAt){
      MEET.members.forEach(w => { if (w.mode === "act" && w.act === "meet") goTo(w, {type:"seat", w}, "desk", deskDur(w)); else { w.pendingMeet = null; w.backAfterMeet = true; } });
      SPOTS.filter(s => s.kind === "meet").forEach(s => { if (s.busy && s.busy.act !== "meet") s.busy = null; });
      pushFeed(`Phòng <b>${esc(MEET.dept.name)}</b> họp xong, ai về bàn nấy`);
      MEET.active = false; MEET.next = t + rnd(50, 85); MEET.el.textContent = "Phòng họp"; MEET.el.classList.remove("meet"); MEET.el.style.background = "";
    }
  }
}

function limbs(p, lh, lk, rh, rk, ls, le, rs, re){
  p.legs[0].hip.rotation.x = lh; p.legs[0].knee.rotation.x = lk; p.legs[1].hip.rotation.x = rh; p.legs[1].knee.rotation.x = rk;
  p.arms[0].sh.rotation.x = ls; p.arms[0].el.rotation.x = le; p.arms[1].sh.rotation.x = rs; p.arms[1].el.rotation.x = re; }
const SIT = Math.PI/2;

function presenceTick(m){
  const ph = phaseOf(m);
  presentCount = 0;
  Object.values(workers).forEach(w => {
    if (!w.pos) return;
    const want = present(w, m);
    if (w.mode !== "home") presentCount++;
    if (!want && w.mode === "act" && !w.leaving && w.act !== "meet"){
      w.leaving = true; if (Math.random() < .6) say(w, pick(PHR.leave)); goTo(w, {type:"door"}, "home", 0); pushFeed(`${nm(w)} tan làm`); }
    if (want && w.mode === "home"){
      w.p.root.visible = true; w.loc = {type:"door"}; w.pos.copy(DOOR); w.mode = "act"; w.leaving = false; w.justArrived = true;
      goTo(w, {type:"seat", w}, "desk", deskDur(w)); pushFeed(`${nm(w)} ${ph === "night" ? "vào làm đêm" : "đến văn phòng"}`); }
  });
  if (HUY && HUY.p){ const v = huyPresent(m); if (v !== HUY.p.root.visible){ HUY.p.root.visible = v; pushFeed(v ? "<b>Anh Huy</b> đến văn phòng" : "<b>Anh Huy</b> về nhà"); } }
}

let lastPresence = -1, lastClockUi = -1;
function lifeUpdate(_t, dt, upd){
  simT += dt; const t = simT;
  if (warp) warpMin = (warpMin + dt*8) % 1440;
  const m = clockMin(), ph = phaseOf(m);
  if (t - lastPresence > .5){ lastPresence = t; presenceTick(m); }
  const autoNight = m < 390 || m >= 1110;
  const wantNight = manualNight === null ? autoNight : manualNight;
  if (wantNight !== night){ night = wantNight; bNight.classList.toggle("on", night); bNight.textContent = night ? "Ban ngày" : "Ban đêm"; }
  if (t - lastClockUi > .5){ lastClockUi = t; const c = document.getElementById("vclock");
    if (c) c.innerHTML = `<span><b>${hhmm(m)}</b> · ${PHASE_TXT[ph]}${warp ? " (tua nhanh)" : ""}</span><span>${presentCount + (HUY && HUY.p && HUY.p.root.visible ? 1 : 0)} người có mặt</span>`; }
  meetTick(t);
  Object.values(workers).forEach((w, i) => {
    if (!w.pos) return;
    if (w.mode === "home"){ if (w.lamp) w.lamp.intensity = 0; w.scrMat.emissiveIntensity = 0; if (w.ring) w.ring.material.opacity = 0; return; }
    const p = w.p; let y = FLOOR_Y;
    p.torso.rotation.x = 0; p.head.rotation.x = 0; p.body.position.y = 0;
    if (w.mode === "walk"){
      const tgt = w.path[w.pi], dx = tgt.x - w.pos.x, dz = tgt.z - w.pos.z, dist = Math.hypot(dx, dz), step = SPEED*(warp ? 3 : 1)*dt;
      if (dist > .01) w.yawT = yawOf(dx, dz);
      if (dist <= step){ w.pos.x = tgt.x; w.pos.z = tgt.z; w.pi++; if (w.pi >= w.path.length) arrive(w); }
      else { w.pos.x += dx/dist*step; w.pos.z += dz/dist*step; }
      w.phase += dt*9.5; const s = Math.sin(w.phase);
      limbs(p, .5*s, -Math.max(0, Math.sin(w.phase - 1.4))*.75, -.5*s, -Math.max(0, Math.sin(w.phase + 1.74))*.75, -.45*s, .3, .45*s, .3);
      p.body.position.y = Math.abs(Math.cos(w.phase))*.06; p.head.rotation.y = 0;
    } else {
      if (w.sit){ y = SEAT_Y;
        if (w.act === "desk"){
          if (w.st === "idle" && !w.lead){ p.torso.rotation.x = -.14; p.head.rotation.x = -.18; limbs(p, SIT, -SIT, SIT, -SIT, .2, .9, .2, .9); }
          else { const fast = w.st === "run" || w.lead, burst = fast || Math.sin(t*.5 + i*1.7) > .3;
            limbs(p, SIT, -SIT, SIT, -SIT, .55, .95 + (burst ? Math.sin(t*15+i)*.08 : 0), .55, .95 + (burst ? Math.sin(t*15+i+2)*.08 : 0));
            p.head.rotation.y = Math.sin(t*(fast ? .7 : .35) + i)*(fast ? .12 : .3); if (burst) w.sc.off += fast ? .12 : .04;
            if (w.note && t > w.noteNext){ w.noteNext = t + rnd(35, 70); say(w, w.note, 4.5); if (Math.random() < .5) pushFeed(`${nm(w)}: ${esc(w.note)}`); } }
        } else if (w.act === "lunch"){ const bite = Math.sin(t*1.3 + i) > .6; limbs(p, SIT, -SIT, SIT, -SIT, .45, .9, bite ? .6 : .45, bite ? 1.8 : 1.0); p.head.rotation.y = Math.sin(t*.4 + i)*.3; }
        else { limbs(p, SIT, -SIT, SIT, -SIT, .35, .7, .35 + (w.bubUntil > t ? Math.sin(t*4)*.15 : 0), .7); p.head.rotation.y = Math.sin(t*.4 + i)*.25; if (w.act === "sofa") p.torso.rotation.x = -.12; }
      } else {
        if (w.act === "coffee"){ const sip = Math.sin(t*.9 + i) > .55; limbs(p, 0,0,0,0, .05,.2, sip ? .55 : .35, sip ? 1.9 : 1.45); }
        else { const talk = w.bubUntil > t; limbs(p, 0,0,0,0, .05,.2, talk ? .45 + Math.sin(t*3.2+i)*.2 : .08, talk ? .9 : .2); p.head.rotation.y = Math.sin(t*.5 + i)*.15; }
        p.body.position.y = Math.sin(t*1.6 + i)*.01;
      }
      if (t > w.timer){ if (w.act === "meet") w.timer = t + 3; else decide(w); }
    }
    let dy = w.yawT - w.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); w.yaw += dy*Math.min(1, dt*9);
    p.root.position.set(w.pos.x, y, w.pos.z); p.root.rotation.y = w.yaw;
    if (w.bubUntil && t > w.bubUntil){ w.bub.classList.remove("on"); w.bubUntil = 0; }
    const atDesk = w.mode === "act" && w.act === "desk";
    if (w.ring){ w.ring.material.opacity = atDesk ? .25 + .35*(.5+.5*Math.sin(t*2.4)) : .1; w.ring.scale.setScalar(1 + .05*Math.sin(t*2.4)); }
    if (upd && w.st !== "idle" && atDesk) drawScreen(w.sc);
    if (w.lamp) w.lamp.intensity = atDesk ? nightK * (w.st === "run" ? 9 : 5) : 0;
    w.scrMat.emissiveIntensity = w.st === "idle" ? 0 : .7 + nightK*.8;
  });
  if (HUY && HUY.p && HUY.p.root.visible){ const p = HUY.p;
    limbs(p, SIT, -SIT, SIT, -SIT, .55, .95 + Math.sin(t*12)*.06, .55, .95 + Math.sin(t*12+2)*.06);
    p.root.position.set(HUY.seat.x, SEAT_Y, HUY.seat.z); p.root.rotation.y = Math.PI; p.head.rotation.y = Math.sin(t*.4)*.2;
    if (HUY.bubUntil && t > HUY.bubUntil){ HUY.bub.classList.remove("on"); HUY.bubUntil = 0; } }
  if (selected && workers[selected] && Math.floor(t*2) !== Math.floor((t-dt)*2)){ const d = document.getElementById("dnow"); if (d) d.textContent = doing(workers[selected]); }
}

/* ---------- Camera ---------- */
const HOME = {pos:new THREE.Vector3(48,62,78), target:new THREE.Vector3(0,0,4)}; let homeSet = false;
camera.position.copy(HOME.pos); controls.target.copy(HOME.target);
let fly = null;
const flyTo = (pos, target, dur=1.3) => { fly = {p0:camera.position.clone(), t0:controls.target.clone(), p1:pos, t1:target, s:performance.now(), d:dur*1000}; };
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function setActive(id){ document.querySelectorAll(".dept").forEach(b => b.classList.toggle("on", b.dataset.room === id)); }
function focusRoom(id){ setActive(id); closeDetail();
  if (id === "lobby") return flyTo(V(LX0+5, -6).add(new THREE.Vector3(14, 26, 30)), V(LX0+5, -6).setY(1));
  if (id === "commons") return flyTo(V(CX0+11, 0).add(new THREE.Vector3(10, 26, 30)), V(CX0+11, 0).setY(1));
  if (id === "all" || !rooms[id]) return flyTo(HOME.pos.clone(), HOME.target.clone());
  const c = rooms[id].center; flyTo(c.clone().add(new THREE.Vector3(14,22,26)), c.clone().add(new THREE.Vector3(0,1,1))); }
document.getElementById("vside").addEventListener("click", e => { const b = e.target.closest(".dept"); if (b){ stopTour(); focusRoom(b.dataset.room); } });
document.getElementById("bReset").onclick = () => { stopTour(); focusRoom("all"); };

const detail = document.getElementById("vdetail"), detailBody = document.getElementById("detailBody");
function showDetail(id){
  const w = workers[id], a = w.a, parent = a.parent && workers[a.parent], kids = ALL.filter(x => x.parent === id);
  detailBody.innerHTML = `<div class="who">${esc(a.name)}</div><span class="vpill"><span class="dot" style="background:${COL[w.st]}"></span>${TXT[w.st]}</span>
    <dl><dt>Phòng ban</dt><dd><span class="dot" style="background:${hex(w.dept.color)};margin-right:6px"></span>${esc(w.dept.name)}</dd>
    ${a.lead ? `<dt>Vai trò</dt><dd>Trưởng phòng</dd>` : ""}
    <dt>Công việc</dt><dd>${esc(a.role)}</dd>
    <dt>Lúc này</dt><dd id="dnow">${esc(doing(w))}</dd>
    ${w.note ? `<dt>Việc gần nhất</dt><dd>${esc(w.note)}</dd>` : ""}
    <dt>Lần cuối</dt><dd>${esc((a.last||"").replace("T"," "))} <span style="color:#76746d">(${ago(a.last)})</span></dd>
    ${parent ? `<dt>Được giao bởi</dt><dd>${esc(parent.a.name)}</dd>` : ""}
    ${kids.length ? `<dt>Đang giao cho</dt><dd>${kids.map(k=>esc(k.name)).join("<br>")}</dd>` : ""}</dl>`;
  detail.style.display = "block";
}
function select(id){
  stopTour(); const w = workers[id]; if (!w) return;
  if (selected && workers[selected]) workers[selected].el.classList.remove("sel");
  selected = id; w.el.classList.add("sel"); setActive(w.dept.id); showDetail(id);
  const P = w.p.root.position.clone();
  flyTo(P.clone().add(new THREE.Vector3(7,9,12)), P.clone().add(new THREE.Vector3(0,1.8,0)));
}
function closeDetail(){ detail.style.display = "none"; if (selected && workers[selected]) workers[selected].el.classList.remove("sel"); selected = null; }
detail.querySelector(".close").onclick = closeDetail;

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let down = null, hovered = null;
function pickAt(e){ const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(mouse, camera);
  const h = ray.intersectObjects(pickables, false)[0]; return h ? h.object.userData.agent : null; }
renderer.domElement.addEventListener("pointerdown", e => { down = {x:e.clientX, y:e.clientY}; stopTour(); fly = null; });
renderer.domElement.addEventListener("pointerup", e => { if (!down || Math.hypot(e.clientX-down.x, e.clientY-down.y) > 5) return; const hit = pickAt(e); if (hit) select(hit); else closeDetail(); });
renderer.domElement.addEventListener("pointermove", e => { const hit = pickAt(e);
  if (hit !== hovered){ if (hovered && workers[hovered]) workers[hovered].el.style.transform = ""; hovered = hit; if (hit) workers[hit].el.style.transform = "scale(1.06)"; }
  renderer.domElement.style.cursor = hit ? "pointer" : ""; });

let tour = null; const bTour = document.getElementById("bTour");
function stopTour(){ if (tour){ clearInterval(tour); tour = null; bTour.classList.remove("on"); } }
bTour.onclick = () => { if (tour) return stopTour(); closeDetail(); bTour.classList.add("on");
  let k = 0; const step = () => { const seq = ["all", "lobby", ...DEPTS.map(d=>d.id), "commons"]; focusRoom(seq[k % seq.length]); k++; }; step(); tour = setInterval(step, 6000); };
let night = false, nightK = 0; const bNight = document.getElementById("bNight");
bNight.onclick = () => { manualNight = !night; };
const bWarp = document.getElementById("bWarp");
bWarp.onclick = () => { if (!warp){ warpMin = clockMin(); warp = true; } else warp = false; manualNight = null;
  bWarp.classList.toggle("on", warp); bWarp.textContent = warp ? "Về giờ thật" : "Tua nhanh 1 ngày";
  pushFeed(warp ? "Bắt đầu tua nhanh: 1 ngày trong 3 phút" : "Về lại giờ thật"); };

function fit(){ const w = W(), h = H(); if (!w || !h) return; camera.aspect = w/h;
  camera.setViewOffset(w, h, -Math.min(140, w*.12), 0, w, h); camera.updateProjectionMatrix();
  renderer.setSize(w, h); labels.setSize(w, h); }
new ResizeObserver(fit).observe(stage); fit();

const clock = new THREE.Clock(); let lastScreen = 0, lastT = 0;
(function tick(){
  const t = clock.getElapsedTime();
  if (fly){ const k = Math.min(1, (performance.now()-fly.s)/fly.d), e = ease(k); camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (k >= 1) fly = null; }
  controls.update();
  nightK += ((night?1:0) - nightK) * .05;
  scene.background.copy(DAY_BG).lerp(NIGHT_BG, nightK); scene.fog.color.copy(scene.background);
  sun.intensity = 1.5*(1-nightK*.85); hemi.intensity = .5*(1-nightK*.6); renderer.toneMappingExposure = 1 - nightK*.15;
  const upd = t - lastScreen > .08; if (upd) lastScreen = t;
  lifeUpdate(t, Math.min(.05, t - lastT), upd); lastT = t;
  links.forEach(l => l.pulses.forEach(pp => pp.s.position.copy(l.curve.getPoint((t*.18 + pp.o) % 1))));
  renderer.render(scene, camera); labels.render(scene, camera);
  requestAnimationFrame(tick);
})();

/* ---------- Dữ liệu: đọc lần đầu, rồi nghe realtime ---------- */
async function load(){
  const r = await sb.from("hub_agent_office").select("depts,snapshot_at").eq("id",1).maybeSingle();
  if (r.error){ document.getElementById("stamp").textContent = "Không đọc được dữ liệu: " + r.error.message; return; }
  build(r.data?.depts || [], r.data?.snapshot_at);
}
await load();
sb.channel("hub-agent-office").on("postgres_changes", {event:"*", schema:"hub", table:"agent_office"}, load).subscribe();
setInterval(() => { if (document.visibilityState === "visible" && !tour) load(); }, 15*60e3);
}
</script>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIMUS Customers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* TIMUS Customers: kiểu Notion cơ bản. Mỗi khách hàng một tab; trong tab có giai đoạn, yêu cầu, nhật ký tiến độ. Chỉ có giao diện sáng. */
:root{color-scheme:light;--bg:#FFFFFF;--side:#F7F7F5;--ink:#37352F;--muted:#5F5E5B;--soft:#787774;--faint:#9B9A97;--line:#E9E9E7;--line2:#DFDFDD;--hover:#F7F6F3;--hover2:#EFEFED;
  --accent:#2383E2;--accent-hover:#0B6EC5;--focus:#2563EB;--scrim:rgba(15,15,15,.32);
  --ok:#1C3829;--ok-bg:#DBEDDB;--warn:#402C1B;--warn-bg:#FDECC8;--bad:#5D1715;--bad-bg:#FFE2DD;--info:#183347;--info-bg:#D3E5EF;--night:#412454;--night-bg:#E8DEEE;--mute:#32302C;--mute-bg:#E3E2E0;
  --bad-num:#C4554D;--warn-num:#B7791F;
  --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1080px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.rq:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
header{padding-block:28px 0;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
.ws{display:flex;align-items:center;gap:8px;font-weight:600}
.ws i{width:20px;height:20px;border-radius:4px;background:var(--ink);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.top a{color:var(--soft);text-decoration:none}.top a:hover{color:var(--ink)}
.top .r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0}
@media (max-width:600px){h1{font-size:26px}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:7px 12px;font-size:14px;color:var(--soft);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:4px 4px 0 0;flex:0 0 auto}
.tabs button:hover{background:var(--hover);color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.tabs small{color:var(--faint);margin-left:5px;font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.stat{border:1px solid var(--line);border-radius:4px;padding:10px 14px;min-width:120px;flex:1 1 120px}
.stat .v{font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--soft);margin-top:2px}
.stat.bad .v{color:var(--bad-num)}.stat.warn .v{color:var(--warn-num)}
h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
h2 span{font-weight:400;font-size:13px;color:var(--soft)}
.hd2{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.hd2 h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.sub{color:var(--soft);font-size:14px;margin-top:2px}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin:0 0 12px}
.track button{border:0;border-radius:3px;background:var(--mute-bg);color:var(--soft);font-size:12.5px;padding:5px 4px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track button.past{background:var(--info-bg);color:var(--info)}
.track button.cur{background:var(--ink);color:#fff;font-weight:500}
.track button.pause.cur{background:var(--warn-bg);color:var(--warn)}
.next{background:#FBF3DB;border-radius:4px;padding:8px 12px;margin:0 0 22px;font-size:14.5px}
.next b{font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.add{display:grid;grid-template-columns:minmax(0,1fr) 120px 140px auto;gap:6px;margin-bottom:14px}
.add input,.add select,.logadd textarea{border:1px solid var(--line2);border-radius:4px;padding:6px 9px;min-width:0;background:#fff;font-size:14.5px}
@media (max-width:640px){.add{grid-template-columns:1fr 1fr}.add .t{grid-column:1/-1}}
details.inp{margin:0 0 14px;border:1px solid var(--line);border-radius:6px}
details.inp>summary{cursor:pointer;padding:7px 10px;font-size:14px;color:var(--soft);list-style:none;border-radius:6px}
details.inp>summary::-webkit-details-marker{display:none}
details.inp>summary::before{content:"";display:inline-block;width:0;height:0;border-left:6px solid var(--soft);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:9px;vertical-align:1px;transition:transform .12s}
details.inp[open]>summary::before{transform:rotate(90deg)}
details.inp>summary:hover{background:var(--hover);color:var(--ink)}
details.inp>.inner{padding:2px 8px 8px}
details.inp .qa,details.inp .add,details.inp .logadd{margin:0;border:0;padding:0}
.grp{font-size:13px;color:var(--soft);font-weight:500;margin:12px 0 4px}
.rq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.rq:hover{background:var(--hover)}
.rq .t1{font-weight:500;font-size:14.5px;overflow-wrap:anywhere}
.rq.done .t1{color:var(--faint);text-decoration:line-through}
.rq .t2{font-size:13px;color:var(--soft)}
.rq select{font-size:12.5px;background:#fff;border:1px solid var(--line2);border-radius:4px;padding:2px 6px}
.late{color:var(--bad-num);font-weight:500}
.pill{display:inline-block;font-size:12.5px;padding:1px 7px;border-radius:3px;white-space:nowrap;line-height:1.5;background:var(--mute-bg);color:var(--mute)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.night{background:var(--night-bg);color:var(--night)}
.empty{color:var(--soft);padding:14px 16px;border:1px dashed var(--line2);border-radius:4px;font-size:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--soft);font-weight:400;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--hover)}
.t1{font-weight:500}.t2{font-size:13px;color:var(--soft)}
.logadd{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.logadd textarea{flex:1;min-height:60px;resize:vertical;font-family:inherit}
.lg{padding:8px 0;border-bottom:1px solid var(--line)}
.lg .h{display:flex;gap:8px;font-size:12.5px;color:var(--soft);align-items:baseline}
.lg .x{margin-left:auto;border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1}
.lg p{margin:2px 0 0;white-space:pre-line;font-size:14.5px;overflow-wrap:anywhere}
.docs{margin-top:26px}
.doc{border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.doc summary{cursor:pointer;padding:9px 12px;font-weight:500;font-size:14.5px}
.doc .in{padding:0 12px 12px}
.doc .bar{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.docs h2{justify-content:flex-start;align-items:center;gap:8px}
.docs h2 .btn{margin-left:auto}
.doc .tag{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:11.5px;font-weight:600;color:var(--soft);vertical-align:1px}
.doc .fn{font-size:13px;color:var(--soft);margin:0 0 8px;overflow-wrap:anywhere}
.doc table{min-width:640px;font-size:14px}
.doc td{vertical-align:top}
.doc td.g{font-weight:600;background:var(--side)}
.doc td.p{font-weight:500;white-space:normal}
.doc .nt{font-size:13px;color:var(--soft);margin:8px 0 0}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:3px 10px;font-size:14px;margin:0 0 22px}
.kv dt{color:var(--soft)}.kv dd{margin:0;overflow-wrap:anywhere}
.btn{border:1px solid var(--line2);background:#fff;border-radius:4px;padding:5px 11px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:#EB5757;border-color:#F5C6C6}.btn.sm{padding:2px 8px;font-size:13px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:31;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(15,15,15,.05),0 9px 24px rgba(15,15,15,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer form{display:contents}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px 8px}
.drawer h3{margin:0;font-size:20px;font-weight:700}
.drawer .body{flex:1;overflow-y:auto;padding:8px 24px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;align-content:start}
.drawer .ft{display:flex;justify-content:space-between;gap:8px;padding:12px 24px;border-top:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft);min-width:0}
label.f.w{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line2);border-radius:4px;padding:6px 9px;width:100%;min-width:0;background:#fff;color:var(--ink);font-size:14.5px;min-height:34px}
.f textarea{resize:vertical;min-height:70px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--side);z-index:60}
.login-card{max-width:380px;width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:12px}
.login-card h1{font-size:26px}.login-card p{margin:0;color:var(--muted);font-size:14px}.login-card .btn{height:38px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<aside id="side" class="nsb" aria-label="Điều hướng"></aside>
<div class="wrap">
  <header class="bar"><h1>TIMUS Customers <span class="cnt" id="pcount"></span></h1></header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Khách hàng" hidden></nav>
  <main id="app"></main>
</div>
<div id="drawerRoot"></div>
<div class="bulk" id="bulk" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../timus/config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="../shell.js?v=7"></script>
<script>
(function(){
"use strict";
var STAGE=[["tiep_can","Tiếp cận"],["dam_phan","Đàm phán"],["thiet_lap","Thiết lập"],["van_hanh","Vận hành"],["tam_dung","Tạm dừng"]];
var RQ_ST=[["moi","Mới"],["dang_lam","Đang làm"],["cho_khach","Chờ khách"],["xong","Xong"]];
var KIND={bao_gia:"Báo giá",hop_dong:"Hợp đồng",thiet_lap:"Thiết lập",van_hanh:"Vận hành",giay_to:"Giấy tờ",khac:"Khác"};
var PRIO={cao:"Cao",thuong:"Thường",thap:"Thấp"};
var S={sel:{},bulkArm:false,open:{},tab:"all",clients:[],reqs:[],ups:[],shops:[],kind:null,edit:null,delArm:false};
var sb=null;

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function opt(v,l,c){return '<option value="'+esc(v)+'"'+(String(c==null?"":c)===String(v)?" selected":"")+'>'+esc(l)+'</option>'}
function today(){var p={};new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});return p.year+"-"+p.month+"-"+p.day}
function dm(s){if(!s)return "";var a=s.split("-");return a[2]+"/"+a[1]}
function when(s){var p={};new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(s)).forEach(function(x){p[x.type]=x.value});return p.hour+":"+p.minute+" · "+p.day+"/"+p.month}
function stageName(k){var x=STAGE.filter(function(s){return s[0]===k})[0];return x?x[1]:""}
var tt=null;function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2600)}
function fail(e){toast(e&&e.code==="42501"?"Tài khoản này không có quyền sửa.":e&&e.code==="23503"?"Còn shop đang gắn với khách hàng này, gỡ shop trước khi xóa.":"Chưa lưu được. Thử lại sau ít phút.")}
function openOf(id){return S.reqs.filter(function(r){return r.client_id===id&&r.status!=="xong"})}
function byId(l,id){return l.filter(function(x){return x.id===id})[0]||null}

/* ---------- dữ liệu ---------- */
async function load(){
  var r=await Promise.all([sb.from("timus_clients").select("*").order("created_at"),sb.from("timus_client_requests").select("*").order("created_at"),sb.from("timus_client_updates").select("*").order("created_at",{ascending:false}),sb.from("timus_shops").select("id,name,platform,market,status,client_id"),sb.from("timus_client_docs").select("*").order("created_at")]);
  if(r.some(function(x){return x.error})){toast("Chưa tải được dữ liệu. Tải lại trang thử lại.");return}
  S.clients=r[0].data||[];S.reqs=r[1].data||[];S.ups=r[2].data||[];S.shops=r[3].data||[];S.docs=r[4].data||[];
  if(S.tab!=="all"&&!byId(S.clients,S.tab))S.tab="all";
  render();
}
var rT=null;function reload(){clearTimeout(rT);rT=setTimeout(load,150)}
async function save(q,msg){var r=await q;if(r.error||(r.data&&!r.data.length)){fail(r.error||{code:"42501"});return false}if(msg)toast(msg);await load();return true}
function clientStatus(st){return st==="tam_dung"?"ended":(st==="thiet_lap"||st==="van_hanh")?"active":"deal"}

/* ---------- vẽ ---------- */
function render(){
  var a=document.activeElement,fid=a&&a.id;
  var val=fid&&a.value,draft=$("#up-new")?$("#up-new").value:"",rqDraft=$("#rq-title")?$("#rq-title").value:"";
  var prev=S.drawnTab;
  $("#tabs").hidden=false;$("#pcount").textContent=S.clients.length;
  $("#tabs").innerHTML='<button role="tab" data-tab="all" aria-selected="'+(S.tab==="all")+'">Tất cả</button>'+S.clients.map(function(c){var n=openOf(c.id).length;return '<button role="tab" data-tab="'+c.id+'" aria-selected="'+(S.tab===c.id)+'">'+esc(c.name)+(n?'<small>'+n+'</small>':"")+'</button>'}).join("")+'<button data-new="client">+ Khách hàng</button>';
  $("#app").innerHTML=S.tab==="all"?vAll():vClient(byId(S.clients,S.tab));
  S.drawnTab=S.tab;renderBulk();
  if(prev===S.tab){if(draft&&$("#up-new"))$("#up-new").value=draft;if(rqDraft&&$("#rq-title"))$("#rq-title").value=rqDraft;if(fid&&document.getElementById(fid)){var el=document.getElementById(fid);if(val!=null&&val!==false&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"))el.value=val;el.focus()}}
}
function vAll(){
  var t=today(),open=S.reqs.filter(function(r){return r.status!=="xong"});
  var late=open.filter(function(r){return r.due_date&&r.due_date<t}).length,wait=open.filter(function(r){return r.status==="cho_khach"}).length;
  var stat=function(v,l,c){return '<div class="stat '+(c||"")+'"><div class="l">'+l.charAt(0).toUpperCase()+l.slice(1)+'</div><div class="v">'+v+'</div></div>'};
  var count=function(k){return S.clients.filter(function(c){return c.stage===k}).length};
  var h='<div class="stats">'+stat(S.clients.length,"khách hàng")+stat(count("dam_phan")+count("tiep_can"),"đang tiếp cận, đàm phán")+stat(count("thiet_lap")+count("van_hanh"),"đang thiết lập, vận hành")+stat(open.length,"yêu cầu đang mở")+stat(late,"yêu cầu quá hạn",late?"bad":"")+stat(wait,"chờ khách phản hồi",wait?"warn":"")+'</div>';
  if(!S.clients.length)return h+'<div class="empty">Chưa có khách hàng. Bấm + Khách hàng để thêm khách đầu tiên; mỗi khách sẽ có một tab riêng.</div>';
  return h+'<h2>Tất cả khách hàng<span>bấm vào một dòng để mở tab</span></h2><div class="tbl"><table><thead><tr><th>Khách hàng</th><th>Giai đoạn</th><th>Yêu cầu</th><th>Hạn gần nhất</th><th>Bước tiếp theo</th></tr></thead><tbody>'
   +S.clients.map(function(c){
     var all=S.reqs.filter(function(r){return r.client_id===c.id}),op=openOf(c.id),dn=all.length-op.length;
     var due=op.map(function(r){return r.due_date}).filter(Boolean).sort()[0];
     return '<tr data-tab="'+c.id+'"><td><div class="t1">'+esc(c.name)+'</div>'+(c.services?'<div class="t2">'+esc(c.services)+'</div>':"")+'</td><td><span class="pill '+(c.stage==="van_hanh"?"ok":c.stage==="tam_dung"?"warn":"info")+'">'+stageName(c.stage)+'</span></td><td>'+dn+'/'+all.length+' xong</td><td class="'+(due&&due<t?"late":"")+'">'+dm(due)+'</td><td class="t2">'+esc(c.next_action||"")+'</td></tr>'}).join("")
   +'</tbody></table></div>';
}
function vClient(c){
  var t=today(),idx=STAGE.map(function(s){return s[0]}).indexOf(c.stage);
  var reqs=S.reqs.filter(function(r){return r.client_id===c.id});
  var dn=reqs.filter(function(r){return r.status==="xong"}).length;
  var shops=S.shops.filter(function(s){return s.client_id===c.id});
  var ups=S.ups.filter(function(u){return u.client_id===c.id});
  var groups=RQ_ST.map(function(s){
    var l=reqs.filter(function(r){return r.status===s[0]}).sort(function(a,b){return (a.priority==="cao"?0:1)-(b.priority==="cao"?0:1)||((a.due_date||"9")<(b.due_date||"9")?-1:1)});
    if(!l.length)return "";
    return '<div class="grp">'+s[1]+' ('+l.length+')</div>'+l.map(function(r){var late=r.due_date&&r.due_date<t&&r.status!=="xong";
      return '<div class="rq'+(r.status==="xong"?" done":"")+'" tabindex="0" data-rq="'+r.id+'"><input type="checkbox" data-rqsel="'+r.id+'" aria-label="Chọn: '+esc(r.title)+'"'+(S.sel[r.id]?" checked":"")+'><div><div class="t1">'+esc(r.title)+'</div><div class="t2">'+[KIND[r.kind],r.priority==="cao"?'<span class="pill bad">Cao</span>':"",r.due_date?'<span class="'+(late?"late":"")+'">Hạn '+dm(r.due_date)+'</span>':"",esc(r.next_step||"")].filter(Boolean).join(" · ")+'</div></div><select data-st="'+r.id+'" aria-label="Đổi trạng thái">'+RQ_ST.map(function(x){return opt(x[0],x[1],r.status)}).join("")+'</select></div>'}).join("");
  }).join("");
  return '<div class="hd2"><div><h3>'+esc(c.name)+'</h3><div class="sub">'+esc(c.services||"Chưa ghi dịch vụ")+' · xong '+dn+'/'+reqs.length+' yêu cầu</div></div><button class="btn sm" data-edit-client="'+c.id+'">Sửa thông tin</button></div>'
   +'<div class="track">'+STAGE.map(function(s,i){return '<button type="button" data-stage="'+s[0]+'" class="'+(i===idx?"cur":i<idx?"past":"")+(s[0]==="tam_dung"?" pause":"")+'">'+s[1]+'</button>'}).join("")+'</div>'
   +'<div class="next"><b>Bước tiếp theo:</b> '+esc(c.next_action||"Chưa ghi. Bấm Sửa thông tin để điền.")+'</div>'
   +'<div class="cols"><section><h2>Yêu cầu<span>'+(reqs.length-dn)+' đang mở</span></h2>'
   +'<details class="inp" data-key="rq"'+(S.open.rq?" open":"")+'><summary>Thêm yêu cầu</summary><div class="inner"><form class="add" id="rq-add"><input class="t" id="rq-title" placeholder="Thêm yêu cầu của khách" aria-label="Yêu cầu mới" autocomplete="off" required><select id="rq-kind" aria-label="Loại">'+Object.keys(KIND).map(function(k){return opt(k,KIND[k],"khac")}).join("")+'</select><input type="date" id="rq-due" aria-label="Hạn"><button class="btn primary" type="submit">Thêm</button></form></div></details>'
   +(groups||'<div class="empty">Chưa có yêu cầu nào.</div>')
   +'</section><section><h2>Tiến độ</h2><details class="inp" data-key="up"'+(S.open.up?" open":"")+'><summary>Ghi tiến độ</summary><div class="inner"><div class="logadd"><textarea id="up-new" placeholder="Hôm nay đã làm gì, khách phản hồi gì..." aria-label="Ghi tiến độ"></textarea><button class="btn sm primary" type="button" id="up-add">Ghi</button></div></div></details>'
   +(ups.length?ups.map(function(u){return '<div class="lg"><div class="h"><span>'+when(u.created_at)+'</span><button class="x" type="button" data-del-up="'+u.id+'" aria-label="Xóa ghi chép">×</button></div><p>'+esc(u.body)+'</p></div>'}).join(""):'<p class="t2">Chưa có ghi chép.</p>')
   +'<h2 style="margin-top:22px">Thông tin</h2><dl class="kv"><dt>Liên hệ</dt><dd>'+esc([c.contact_name,c.phone,c.email].filter(Boolean).join(" · ")||"Chưa có")+'</dd><dt>Hợp đồng</dt><dd>'+(c.contract_start?"từ "+dm(c.contract_start):"Chưa ký")+'</dd><dt>Shop</dt><dd>'+(shops.length?esc(shops.map(function(s){return s.name}).join(", ")):"Chưa có shop")+'</dd>'+(c.notes?'<dt>Ghi chú</dt><dd>'+esc(c.notes)+'</dd>':"")+'</dl></section></div>'+docsHtml(c);
}

function docTable(d){return '<table><thead><tr><th>Khoản</th><th>Nội dung</th><th>Giá</th></tr></thead><tbody>'+(d.rows||[]).map(function(r){return r.length===1?'<tr><td class="g" colspan="3">'+esc(r[0])+'</td></tr>':'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="p">'+esc(r[2])+'</td></tr>'}).join("")+'</tbody></table>'}
var FILES="timus-client-files";
function fsize(b){return b>=1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function docsHtml(c){var l=(S.docs||[]).filter(function(d){return d.client_id===c.id});
  return '<div class="docs"><h2>Tài liệu<span>'+l.length+'</span><button class="btn sm" type="button" data-up-file="new">Tải PDF lên</button></h2>'+(l.length?l.map(function(d){var k="doc"+d.id,hasRows=(d.rows||[]).length>0;
    var bar=(d.file_path?'<button class="btn sm primary" type="button" data-open-file="'+d.id+'">Mở PDF</button><button class="btn sm" type="button" data-up-file="'+d.id+'">Thay PDF</button><button class="btn sm" type="button" data-rm-file="'+d.id+'">Gỡ PDF</button>':'<button class="btn sm" type="button" data-up-file="'+d.id+'">Đính kèm PDF</button>')+(hasRows?'<button class="btn sm" type="button" data-print-doc="'+d.id+'">In bảng</button>':"");
    return '<details class="doc" data-key="'+k+'"'+(S.open[k]?" open":"")+'><summary>'+esc(d.title)+(d.file_path?'<span class="tag">PDF</span>':"")+'</summary><div class="in"><div class="bar">'+bar+'</div>'+(d.file_path?'<p class="fn">'+esc(d.file_name||"")+(d.file_size?" · "+fsize(d.file_size):"")+'</p>':"")+(hasRows?'<div class="tbl">'+docTable(d)+'</div>':"")+(d.note?'<p class="nt">'+esc(d.note)+'</p>':"")+'</div></details>'}).join(""):'<p class="t2">Chưa có tài liệu.</p>')+'<input type="file" id="doc-file" accept="application/pdf" hidden></div>'}
function safeName(n){return String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/-+/g,"-").slice(-120)||"tai-lieu.pdf"}
async function uploadDoc(target,f){
  if(!f)return;if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){toast("Chỉ nhận file PDF.");return}
  if(f.size>52428800){toast("File lớn hơn 50 MB.");return}
  var cid=S.tab,path=cid+"/"+Date.now()+"-"+safeName(f.name);toast("Đang tải lên...");
  var up=await sb.storage.from(FILES).upload(path,f,{upsert:false,contentType:"application/pdf"});if(up.error){fail(up.error);return}
  var meta={file_path:path,file_name:f.name,file_size:f.size},old=target!=="new"?byId(S.docs||[],target):null,ok;
  if(old){ok=await save(sb.from("timus_client_docs").update(meta).eq("id",old.id).select("id"),"Đã lưu PDF");if(ok&&old.file_path)await sb.storage.from(FILES).remove([old.file_path])}
  else{meta.client_id=cid;meta.title=f.name.replace(/\.pdf$/i,"");ok=await save(sb.from("timus_client_docs").insert(meta).select("id"),"Đã tải PDF lên")}
  if(!ok)await sb.storage.from(FILES).remove([path]);
}
async function openDoc(id){var d=byId(S.docs||[],id);if(!d||!d.file_path)return;var w=window.open("","_blank");
  var r=await sb.storage.from(FILES).createSignedUrl(d.file_path,600);if(r.error){if(w)w.close();fail(r.error);return}
  if(w)w.location.href=r.data.signedUrl;else location.href=r.data.signedUrl}
async function removeDoc(id){var d=byId(S.docs||[],id);if(!d||!d.file_path)return;var hasRows=(d.rows||[]).length>0;
  if(!confirm(hasRows?"Gỡ file PDF khỏi tài liệu này? Bảng tóm tắt vẫn giữ.":"Xóa tài liệu "+d.title+"?"))return;
  var ok=hasRows?await save(sb.from("timus_client_docs").update({file_path:null,file_name:null,file_size:null}).eq("id",id).select("id"),"Đã gỡ PDF"):await save(sb.from("timus_client_docs").delete().eq("id",id).select("id"),"Đã xóa tài liệu");
  if(ok)await sb.storage.from(FILES).remove([d.file_path])}
function printDoc(id){var d=byId(S.docs||[],id);if(!d)return;var w=window.open("","_blank");if(!w){toast("Trình duyệt đang chặn cửa sổ in.");return}
  w.document.write('<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>'+esc(d.title)+'</title><style>@page{size:A4;margin:1.3cm 1.5cm}body{font-family:"Times New Roman",serif;font-size:10pt;color:#000;margin:16px}h1{font-size:14pt;text-align:center;margin:0 0 7pt}table{border-collapse:collapse;width:100%}th,td{border:.7pt solid #000;padding:2pt 4pt;text-align:left;vertical-align:top;font-size:9.5pt}th,td.g,td.p{font-weight:bold}th:first-child{width:22%}th:last-child{width:24%}tr{page-break-inside:avoid}p{font-size:9pt}</style></head><body><h1>'+esc(d.title).toUpperCase()+'</h1>'+docTable(d)+(d.note?'<p>'+esc(d.note)+'</p>':"")+'</body></html>');w.document.close();w.focus();w.print()}

function selIds(){return S.reqs.filter(function(r){return S.sel[r.id]&&r.client_id===S.tab}).map(function(r){return r.id})}
function renderBulk(){
  var n=selIds().length,b=$("#bulk");b.hidden=!n;if(!n){S.bulkArm=false;b.innerHTML="";return}
  b.innerHTML='<span>Đã chọn: '+n+'</span>'+RQ_ST.map(function(s){return '<button type="button" data-rqbulk="'+s[0]+'">'+s[1]+'</button>'}).join("")+'<i></i><button type="button" data-rqbulk="del">'+HT.ic("trash")+(S.bulkArm?"Bấm lần nữa để xóa":"Xóa")+'</button><button type="button" class="end" data-rqbulk="clear">Bỏ chọn</button>';
}
async function rqBulk(k){
  if(k==="clear"){S.sel={};render();return}
  var ids=selIds();if(!ids.length)return;
  if(k==="del"&&!S.bulkArm){S.bulkArm=true;renderBulk();return}
  var q=sb.from("timus_client_requests"),ok=await save((k==="del"?q.delete():q.update({status:k})).in("id",ids).select("id"),k==="del"?"Đã xóa "+ids.length+" yêu cầu":"Đã chuyển "+ids.length+" yêu cầu");
  if(ok){S.sel={};render()}
}

/* ---------- ngăn sửa ---------- */
function drawer(title,body,del){
  S.delArm=false;
  $("#drawerRoot").innerHTML='<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-h"><form id="d-form"><div class="hd"><h3 id="d-h">'+esc(title)+'</h3><button class="btn sm" type="button" data-close="1">Đóng</button></div><div class="body">'+body+'</div><div class="ft"><div>'+(del?'<button class="btn danger" type="button" id="d-del">Xóa</button>':"")+'</div><div style="display:flex;gap:6px"><button class="btn" type="button" data-close="1">Hủy</button><button class="btn primary" type="submit">Lưu</button></div></div></form></aside>';
  var f=$(".drawer input");if(f)f.focus();
}
var inp=function(k,l,type,v,w){return '<label class="f'+(w?" w":"")+'">'+l+'<input id="d-'+k+'" type="'+type+'" value="'+esc(v||"")+'"></label>'};
var ta=function(k,l,v){return '<label class="f w">'+l+'<textarea id="d-'+k+'">'+esc(v||"")+'</textarea></label>'};
var sel=function(k,l,html){return '<label class="f">'+l+'<select id="d-'+k+'">'+html+'</select></label>'};
function clientForm(c){
  S.kind="client";S.edit=c?c.id:null;c=c||{stage:"dam_phan"};
  drawer(S.edit?"Sửa khách hàng":"Thêm khách hàng",inp("name","Tên khách hàng, thương hiệu","text",c.name,true)+sel("stage","Giai đoạn",STAGE.map(function(s){return opt(s[0],s[1],c.stage)}).join(""))+inp("contract_start","Ngày bắt đầu hợp đồng","date",c.contract_start)+inp("services","Dịch vụ","text",c.services,true)+ta("next_action","Bước tiếp theo",c.next_action)+inp("contact_name","Người liên hệ","text",c.contact_name)+inp("phone","Điện thoại, Zalo","text",c.phone)+inp("email","Email","email",c.email,true)+ta("notes","Ghi chú",c.notes),!!S.edit);
}
function reqForm(r){
  S.kind="req";S.edit=r.id;
  drawer("Sửa yêu cầu",inp("title","Yêu cầu","text",r.title,true)+sel("status","Trạng thái",RQ_ST.map(function(s){return opt(s[0],s[1],r.status)}).join(""))+sel("kind","Loại",Object.keys(KIND).map(function(k){return opt(k,KIND[k],r.kind)}).join(""))+sel("priority","Ưu tiên",Object.keys(PRIO).map(function(k){return opt(k,PRIO[k],r.priority)}).join(""))+inp("due_date","Hạn","date",r.due_date)+ta("next_step","Bước tiếp theo",r.next_step)+ta("notes","Chi tiết, nội dung trao đổi",r.notes),true);
}
function closeDrawer(){S.kind=null;S.edit=null;$("#drawerRoot").innerHTML=""}
async function saveDrawer(){
  var v=function(k){return $("#d-"+k).value.trim()},n=function(k){return v(k)||null},ok;
  if(S.kind==="client"){
    if(!v("name")){toast("Điền tên khách hàng");return}
    var o={name:v("name"),stage:v("stage"),status:clientStatus(v("stage")),contract_start:n("contract_start"),services:n("services"),next_action:n("next_action"),contact_name:n("contact_name"),phone:n("phone"),email:n("email"),notes:n("notes")};
    if(S.edit)ok=await save(sb.from("timus_clients").update(o).eq("id",S.edit).select("id"),"Đã lưu");
    else{var r=await sb.from("timus_clients").insert(o).select("id");if(r.error||!(r.data||[]).length){fail(r.error);return}S.tab=r.data[0].id;ok=true;toast("Đã thêm khách hàng");await load()}
  }else{
    if(!v("title")){toast("Điền yêu cầu");return}
    ok=await save(sb.from("timus_client_requests").update({title:v("title"),status:v("status"),kind:v("kind"),priority:v("priority"),due_date:n("due_date"),next_step:n("next_step"),notes:n("notes")}).eq("id",S.edit).select("id"),"Đã lưu");
  }
  if(ok)closeDrawer();
}
async function delItem(){
  if(!S.delArm){S.delArm=true;$("#d-del").textContent="Bấm lần nữa để xóa";return}
  var t=S.kind==="client"?"timus_clients":"timus_client_requests";
  if(await save(sb.from(t).delete().eq("id",S.edit).select("id"),"Đã xóa"))closeDrawer();
}

/* ---------- sự kiện ---------- */
function bind(){
  document.addEventListener("click",async function(e){
    var t=e.target;
    if(t.closest("[data-close]")){closeDrawer();return}
    if(t.id==="d-del"){delItem();return}
    if(t.closest("[data-new]")){clientForm();return}
    var tb=t.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;try{history.replaceState(null,"","#"+S.tab)}catch(_){}render();window.scrollTo(0,0);return}
    var ec=t.closest("[data-edit-client]");if(ec){clientForm(byId(S.clients,ec.dataset.editClient));return}
    var sg=t.closest("[data-stage]");if(sg){var st=sg.dataset.stage;await save(sb.from("timus_clients").update({stage:st,status:clientStatus(st)}).eq("id",S.tab).select("id"),"Đã chuyển sang "+stageName(st));return}
    if(t.id==="up-add"){var u=$("#up-new"),b=u.value.trim();if(!b)return;u.value="";if(!await save(sb.from("timus_client_updates").insert({client_id:S.tab,body:b}).select("id"),"Đã ghi"))$("#up-new").value=b;return}
    var pd=t.closest("[data-print-doc]");if(pd){printDoc(pd.dataset.printDoc);return}
    var uf=t.closest("[data-up-file]");if(uf){S.upTarget=uf.dataset.upFile;var fi=$("#doc-file");fi.value="";fi.click();return}
    var of=t.closest("[data-open-file]");if(of){openDoc(of.dataset.openFile);return}
    var rf=t.closest("[data-rm-file]");if(rf){removeDoc(rf.dataset.rmFile);return}
    var du=t.closest("[data-del-up]");if(du){await save(sb.from("timus_client_updates").delete().eq("id",du.dataset.delUp).select("id"),"Đã xóa ghi chép");return}
    var bk=t.closest("[data-rqbulk]");if(bk){rqBulk(bk.dataset.rqbulk);return}
    if(t.closest("select")||t.dataset.rqsel)return;
    var rq=t.closest("[data-rq]");if(rq)reqForm(byId(S.reqs,rq.dataset.rq));
  });
  document.addEventListener("toggle",function(e){var k=e.target.dataset&&e.target.dataset.key;if(k)S.open[k]=e.target.open},true);
  document.addEventListener("change",function(e){if(e.target.id==="doc-file"){uploadDoc(S.upTarget||"new",e.target.files&&e.target.files[0]);return}if(e.target.dataset.rqsel){S.sel[e.target.dataset.rqsel]=e.target.checked;S.bulkArm=false;renderBulk();return}var id=e.target.dataset.st;if(id)save(sb.from("timus_client_requests").update({status:e.target.value}).eq("id",id).select("id"),"Đã cập nhật")});
  document.addEventListener("submit",async function(e){
    if(e.target.id==="d-form"){e.preventDefault();saveDrawer();return}
    if(e.target.id==="rq-add"){
      e.preventDefault();var ti=$("#rq-title"),title=ti.value.trim();if(!title)return;
      var o={client_id:S.tab,title:title,kind:$("#rq-kind").value,due_date:$("#rq-due").value||null};
      ti.value="";if(await save(sb.from("timus_client_requests").insert(o).select("id"),"Đã thêm yêu cầu")){var x=$("#rq-title");if(x)x.focus()}else{$("#rq-title").value=title}
    }
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&S.kind){closeDrawer();return}
    if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("rq")){e.preventDefault();reqForm(byId(S.reqs,e.target.dataset.rq))}
  });
  window.addEventListener("focus",reload);
  HT.onSignout=async function(){await sb.auth.signOut();location.reload()};
}

/* ---------- đăng nhập ---------- */
function loginScreen(){
  return new Promise(function(resolve){
    var box=document.createElement("div");box.id="login";
    box.innerHTML='<form id="loginform" class="login-card"><div class="ws"><i>H</i>Huy Tim · TIMUS</div><h1>Đăng nhập</h1><p>Trang khách hàng chỉ dành cho admin TIMUS.</p><label class="f">Email<input id="loginemail" type="email" required autocomplete="username"></label><label class="f">Mật khẩu<input id="loginpw" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Đăng nhập</button><p id="loginmsg" role="status"></p></form>';
    document.body.appendChild(box);
    var msg=$("#loginmsg");
    $("#loginform").addEventListener("submit",async function(e){e.preventDefault();msg.textContent="Đang đăng nhập...";var res=await sb.auth.signInWithPassword({email:$("#loginemail").value.trim(),password:$("#loginpw").value});if(res.error)msg.textContent="Sai email hoặc mật khẩu."});
    sb.auth.onAuthStateChange(function(ev,session){if(session)setTimeout(function(){box.remove();resolve(session)},0)});
  });
}
(async function(){
  var cfg=window.TIMUS_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl){$("#app").textContent="Chưa tải được thư viện kết nối. Tải lại trang.";return}
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.anonKey,{auth:{persistSession:true,detectSessionInUrl:true}});
  var cur=await sb.auth.getSession(),session=cur.data&&cur.data.session;
  if(!session)session=await loginScreen();
  var email=String(session.user.email||"").toLowerCase();
  HT.render({base:"../",active:"khach",user:{email:email,actions:[{icon:"out",label:"Đăng xuất",attrs:"data-ht-signout"}]}});HT.onSignout=async function(){await sb.auth.signOut();location.reload()};
  var r=await sb.from("core_roles").select("area,role").eq("email",email);
  var ok=!r.error&&(r.data||[]).some(function(x){return (x.area==="all"&&(x.role==="owner"||x.role==="admin"))||(x.area==="timus"&&(x.role==="owner"||x.role==="admin"))});
  if(!ok){$("#app").innerHTML='<div class="empty">Tài khoản này không có quyền xem trang khách hàng.</div>';return}
  var h=(location.hash||"").replace("#","");if(h)S.tab=h;
  bind();await load();
  sb.channel("timus-customers").on("postgres_changes",{event:"*",schema:"timus",table:"client_requests"},reload).on("postgres_changes",{event:"*",schema:"timus",table:"client_updates"},reload).on("postgres_changes",{event:"*",schema:"timus",table:"client_docs"},reload).subscribe();
})();
})();
</script>

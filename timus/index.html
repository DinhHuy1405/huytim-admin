<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIMUS Vận hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: kiểu Notion cơ bản như trang quản lý mentor.huytim.com. Thanh bên trái cố định (điều hướng + shop theo thị trường), tiêu đề trang to canh trái, bảng gọn kiểu database, form mở ở ngăn bên phải. Chỉ có giao diện sáng, giống trang mentor. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --side:#F7F7F5; --ink:#37352F; --muted:#5F5E5B; --soft:#787774; --faint:#9B9A97;
  --line:#E9E9E7; --line2:#DFDFDD; --hover:#F7F6F3; --hover2:#EFEFED; --sel:#E8E8E6;
  --accent:#2383E2; --accent-hover:#0B6EC5; --accent-ink:#FFFFFF; --focus:#2563EB;
  --ok:#1C3829; --ok-bg:#DBEDDB; --warn:#402C1B; --warn-bg:#FDECC8; --bad:#5D1715; --bad-bg:#FFE2DD;
  --info:#183347; --info-bg:#D3E5EF; --night:#412454; --night-bg:#E8DEEE; --mute:#32302C; --mute-bg:#E3E2E0;
  --bad-num:#C4554D; --warn-num:#B7791F; --ok-num:#448361;
  --blk-bad:#FBE4E4; --blk-warn:#FBF3DB; --blk-info:#E7F3F8;
  --field:#FFFFFF; --scrim:rgba(15,15,15,.32);
  --pf-shopee:#E8492A; --pf-lazada:#2E3AB8; --pf-tiktok:#37352F; --pf-amazon:#D98200; --pf-shopify:#5E8E3E; --pf-ebay:#0064D2; --pf-other:#9B9A97;
  --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(256px,calc(240px + 16px + env(safe-area-inset-left,0px)));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1040px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,tr:focus-visible,.card:focus-visible,.pcard:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* thanh bên */
.nsb{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--side);border-right:1px solid var(--line);padding:14px 8px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:calc(8px + env(safe-area-inset-left,0px));overflow:auto;font-size:14px;color:var(--ink);z-index:5}
.nsb .ws{display:flex;align-items:center;gap:8px;padding:6px 10px 12px;font-weight:600}
.nsb .ws i{width:20px;height:20px;border-radius:4px;background:var(--ink);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.nsb h5{margin:16px 10px 4px;font-size:12px;font-weight:600;color:var(--faint)}
.nsb a{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;border-radius:4px;color:var(--muted);text-decoration:none;white-space:nowrap;line-height:1.7;cursor:pointer}
.nsb a span{overflow:hidden;text-overflow:ellipsis}
.nsb a:hover{background:#EBEBE9}
.nsb a[aria-current="page"]{background:var(--sel);color:var(--ink);font-weight:500}
.nsb a small{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.nsb a.dim{color:var(--faint)}
.nsb .who{margin:16px 10px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:13px;color:var(--soft)}
.nsb .who b{color:var(--ink);font-weight:500}
@media (max-width:820px){
  body{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .nsb{position:static;width:auto;margin:0 -16px;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
  .nsb .ws,.nsb h5,.nsb .nsb-st,.nsb a small{display:none}
  .nsb a{padding:2px 10px}
  .nsb .who{margin:0 0 0 auto;flex-direction:row;align-items:center}
}

/* tiêu đề trang */
header.bar{padding-block:40px 0;margin-bottom:22px}
header.bar h1{font-size:34px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.2}
.clocks{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--soft);margin-top:6px}
.clocks b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
@media (max-width:600px){header.bar{padding-block:28px 0}header.bar h1{font-size:26px}}

/* ô số liệu */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:130px;flex:1 1 130px}
.stat .v{font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat .l{font-size:12.5px;color:var(--soft);margin-top:2px;line-height:1.35}
.stat.bad .v{color:var(--bad-num)} .stat.warn .v{color:var(--warn-num)} .stat.ok .v{color:var(--ok-num)}

/* khối nội dung */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters input,.filters select{background:var(--field);border:1px solid var(--line2);border-radius:var(--r);padding:5px 9px;min-width:0;max-width:100%;font-size:14px}
.filters input[type=search]{width:240px}
h2.sec{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-bottom:4px;border-bottom:1px solid var(--line)}
h2.sec span{font-weight:400;color:var(--soft);font-size:13px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:32px;align-items:start}
.cols2>*{min-width:0}
.block{margin-top:32px}
.empty{color:var(--soft);padding:18px 20px;border:1px dashed var(--line2);border-radius:var(--r)}
.note{color:var(--soft);font-size:13px}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}

/* nhãn kiểu tag Notion */
.pill{display:inline-block;font-size:12.5px;font-weight:400;padding:1px 7px;border-radius:3px;white-space:nowrap;line-height:1.5;background:var(--mute-bg);color:var(--mute)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--mute-bg);color:var(--mute)} .pill.night{background:var(--night-bg);color:var(--night)}
.pf{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pf::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--pf-other))}
.pf-shopee{--c:var(--pf-shopee)} .pf-lazada{--c:var(--pf-lazada)} .pf-tiktok{--c:var(--pf-tiktok)} .pf-amazon{--c:var(--pf-amazon)} .pf-shopify{--c:var(--pf-shopify)} .pf-ebay{--c:var(--pf-ebay)}
.mk{font-size:12px;font-weight:500;padding:0 6px;border-radius:3px;background:var(--mute-bg);color:var(--mute);line-height:1.6;display:inline-block}
.mk.US{background:var(--night-bg);color:var(--night)} .mk.VN{background:var(--info-bg);color:var(--info)}

/* bảng kiểu database */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--soft);font-weight:400;white-space:nowrap;border-top:1px solid var(--line)}
td{height:40px}
tbody tr.click{cursor:pointer} tbody tr:hover{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t1{font-weight:500} .t2{font-size:13px;color:var(--soft)}
tfoot td{font-weight:600;font-variant-numeric:tabular-nums;border-bottom:0}
tfoot tr:hover{background:none}
td input.cell{width:100%;min-width:84px;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
td input.cell:hover{border-color:var(--line2);background:var(--field)}
td input.cell:focus{border-color:var(--accent);background:var(--field);outline:0}

/* cần xử lý: khối nền màu nhạt */
.alerts{display:flex;flex-direction:column;gap:4px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border-radius:var(--r);padding:8px 12px;background:var(--hover)}
.alert.bad{background:var(--blk-bad)} .alert.warn{background:var(--blk-warn)} .alert.info{background:var(--blk-info)}
.alert .msg{min-width:0}
.alert .msg small{display:block;color:var(--soft);font-size:13px}

/* lịch sale */
.events{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ev:last-child{border-bottom:0}
.ev .d{font-weight:600;font-variant-numeric:tabular-nums}
.ev .left{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev.big .nm{font-weight:500}

/* thanh khối lượng */
.load{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14.5px}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbar{height:8px;background:var(--mute-bg);border-radius:2px;overflow:hidden;display:flex}
.lbar i{display:block;height:100%}
.lbar i.a{background:var(--ink)} .lbar i.b{background:var(--faint)}
.lrow .v{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.matrix table{min-width:0}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}

/* lịch ca */
.sched table{min-width:820px}
.sched th small{display:block;font-size:13px;color:var(--ink)}
.sched th.today small{color:var(--accent);font-weight:600}
.sched td{text-align:center;padding:4px}
.sched td:first-child{text-align:left;padding-left:8px}
.slot{width:100%;min-height:32px;border:1px dashed var(--line2);background:transparent;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--faint)}
.slot:hover{background:var(--hover2)}
.slot.vn{border:0;background:var(--info-bg);color:var(--info);font-weight:500}
.slot.us{border:0;background:var(--night-bg);color:var(--night);font-weight:500}
.slot.off{border:0;background:var(--mute-bg);color:var(--mute)}
.slot.leave{border:0;background:var(--warn-bg);color:var(--warn)}
.slot.live{box-shadow:inset 0 0 0 2px currentColor}
tr.cov td{font-size:13px;color:var(--soft);height:32px}
tr.cov:hover{background:none}
tr.cov td.zero{color:var(--bad-num);font-weight:600}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px 20px;margin-top:16px}
.legend div{display:flex;gap:10px;align-items:center;font-size:14px}
.legend .slot{width:44px;min-height:26px;flex:0 0 auto;cursor:default}
.pop{position:fixed;z-index:40;background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);padding:4px;display:flex;flex-direction:column;min-width:220px}
.pop button{border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:14px}
.pop button:hover{background:var(--hover2)}
.pop small{color:var(--soft);font-variant-numeric:tabular-nums}

/* bảng việc kiểu board */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.colk{min-width:0;display:flex;flex-direction:column;gap:6px}
.colk h3{margin:0 2px 4px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;color:var(--soft)}
.colk h3 b{font-weight:500}
.colk[data-s="todo"] h3 b{background:var(--mute-bg);color:var(--mute);padding:0 7px;border-radius:3px}
.colk[data-s="doing"] h3 b{background:var(--info-bg);color:var(--info);padding:0 7px;border-radius:3px}
.colk[data-s="review"] h3 b{background:var(--warn-bg);color:var(--warn);padding:0 7px;border-radius:3px}
.colk[data-s="done"] h3 b{background:var(--ok-bg);color:var(--ok);padding:0 7px;border-radius:3px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 0 0 1px rgba(15,15,15,.1),0 2px 4px rgba(15,15,15,.06);padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.card:hover{background:var(--hover)}
.card .tt{font-weight:500;font-size:14.5px;overflow-wrap:anywhere}
.card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--soft)}
.card .due.late{color:var(--bad-num);font-weight:500}
.card select{font-size:12.5px;background:var(--field);border:1px solid var(--line2);border-radius:var(--r);padding:2px 6px;align-self:flex-start}

/* thẻ nhân viên / khách hàng */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard:hover{background:var(--hover)}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pcard .nm{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:3px 10px;font-size:14px;margin:0}
.kv dt{color:var(--soft)} .kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* nút và ô nhập */
.btn{border:1px solid var(--line2);background:#fff;border-radius:var(--r);padding:5px 11px;cursor:pointer;font-weight:400;white-space:nowrap;font-size:14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{background:var(--hover2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:#EB5757;border-color:#F5C6C6} .btn.danger:hover{background:var(--blk-bad)}
.btn.sm{padding:2px 8px;font-size:13px}
.btn.on{background:var(--sel);border-color:var(--line2);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft);min-width:0}
.f input,.f select,.f textarea{background:var(--field);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;color:var(--ink);width:100%;min-width:0;font-size:14.5px;min-height:34px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px rgba(35,131,226,.15)}
.f textarea{resize:vertical;min-height:64px}
.f.wide{grid-column:1/-1}
.f .hint{font-size:12px;color:var(--faint)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;background:var(--mute-bg);border-radius:3px;padding:2px 8px;color:var(--mute);font-size:13.5px;cursor:pointer}
.checks label:has(input:checked){background:var(--info-bg);color:var(--info)}
.checks input{margin:0;width:auto;min-height:0}
.fsec{grid-column:1/-1;font-size:15px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fsec:first-child{margin-top:0}

/* ngăn bên phải kiểu side peek */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;z-index:31;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(15,15,15,.05),0 9px 24px rgba(15,15,15,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px 8px}
.drawer header h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.drawer .body{flex:1;overflow-y:auto;padding:10px 24px 20px}
.drawer footer{display:flex;justify-content:space-between;gap:8px;padding:12px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer .extra{margin-top:18px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{opacity:1}
.banner{background:var(--blk-warn);color:var(--warn);padding:10px 14px;border-radius:var(--r);margin-bottom:16px;font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:28px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:4px}
.steps .panel h3{margin:0 0 6px;font-size:15px;font-weight:600}
.steps .panel p{margin:0 0 12px;color:var(--muted);font-size:14px}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--side);z-index:60}
.login-card{max-width:380px;width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 24px rgba(15,15,15,.06)}
.login-card .ws{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.login-card .ws i{width:20px;height:20px;border-radius:4px;background:var(--ink);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.login-card h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.login-card .btn{height:38px}
#loginmsg{min-height:1.3em}
html,body{margin:0}
.qa{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px 100px 160px auto;gap:6px;margin:0 0 28px;padding:8px;border:1px solid var(--line);border-radius:6px}
.qa input,.qa select{border:1px solid var(--line2);border-radius:4px;padding:6px 9px;min-width:0;background:#fff;font-size:14.5px}
@media (max-width:760px){.qa{grid-template-columns:1fr 1fr}.qa #qa-title{grid-column:1/-1}}
.tlist{display:flex;flex-direction:column;margin-bottom:24px}
.tl{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.tl:hover{background:var(--hover)}
.tl .tick,.cl-i input{width:16px;height:16px;margin:0;cursor:pointer;accent-color:var(--accent)}
.tl-b{min-width:0;cursor:pointer}
.tl.done .t1{text-decoration:line-through;color:var(--faint)}
.late{color:var(--bad-num);font-weight:500}
.notes{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.nb{margin:0;font-size:14px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.f.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.f.chk input{width:auto;min-height:0}
.cl-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 2px;border-radius:4px;font-size:14.5px}
.cl-i:hover{background:var(--hover)}
.cl-i.done span{text-decoration:line-through;color:var(--faint)}
.x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{background:var(--hover2);color:var(--ink)}
.cl-add,.log-add{display:flex;gap:6px;margin-top:8px;align-items:flex-start}
.cl-add input,.log-add textarea{flex:1;border:1px solid var(--line2);border-radius:4px;padding:6px 9px;min-width:0;font-size:14.5px;font-family:inherit}
.log-add textarea{min-height:60px;resize:vertical}
.lg{padding:8px 0;border-bottom:1px solid var(--line)}
.lg-h{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--soft)}
.lg-h b{color:var(--ink);font-weight:500;font-size:14px}
.lg-h .x{margin-left:auto}
.lg p{margin:2px 0 0;white-space:pre-line;font-size:14.5px;overflow-wrap:anywhere}
.hlp{border:0;background:var(--mute-bg);color:var(--mute);width:18px;height:18px;border-radius:50%;font-size:11.5px;font-weight:600;cursor:pointer;margin-left:8px;padding:0;line-height:18px;vertical-align:2px;font-family:inherit}
.hlp:hover{background:var(--line2)}
h2.sec .hlp{margin-right:auto}
.tour-bg{position:fixed;inset:0;background:var(--scrim);z-index:70;display:grid;place-items:center;padding:16px}
.tour{background:#fff;border-radius:8px;max-width:480px;width:100%;padding:22px 24px;box-shadow:0 0 0 1px rgba(15,15,15,.05),0 9px 24px rgba(15,15,15,.2);display:flex;flex-direction:column;gap:12px}
.tour h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.tour p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.tour .dots{display:flex;gap:5px}.tour .dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}.tour .dots i.on{background:var(--ink)}
details.ntg{border-bottom:1px solid var(--line);padding:4px 0}
details.ntg>summary{cursor:pointer;font-size:17px;font-weight:600;padding:8px 4px;border-radius:4px;list-style:none}
details.ntg>summary::-webkit-details-marker{display:none}
details.ntg>summary::before{content:"";display:inline-block;width:0;height:0;border-left:6px solid var(--soft);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:10px;vertical-align:2px;transition:transform .12s}
details.ntg[open]>summary::before{transform:rotate(90deg)}
details.ntg>summary:hover{background:var(--hover)}
.gl{margin:2px 0 12px;padding-left:40px;display:grid;gap:6px;font-size:15px}
.upl{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:6px;margin-top:8px}
.upl input,.upl select{border:1px solid var(--line2);border-radius:4px;padding:6px 9px;min-width:0;background:#fff;font-size:14px;font-family:inherit}
.upl input[type=file]{grid-column:1/-1;padding:5px}
.upl .btn{grid-column:1/-1;justify-self:start}
details.dn{margin-top:4px}details.dn summary{cursor:pointer;color:var(--soft);font-size:14px;padding:4px 0}
[hidden]{display:none!important}
@media (max-width:640px){.filters input[type=search]{width:100%}.lrow{grid-template-columns:minmax(0,1fr) auto}.lrow .lbar{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</div>

<script src="config.js?v=1"></script>

<script src="store.js?v=5"></script>
<script>
(function(){
"use strict";
/* ---------- danh mục ---------- */
var VIEWS=[["mine","Việc của tôi"],["reports","Báo cáo"],["guide","Cẩm nang"],["overview","Tổng quan"],["shops","Shop"],["staff","Nhân viên"],["schedule","Lịch ca"],["tasks","Công việc"],["performance","Hiệu suất"],["clients","Khách hàng"]];
var PF={shopee:"Shopee",lazada:"Lazada",tiktok:"TikTok Shop",amazon:"Amazon",shopify:"Shopify",ebay:"eBay",other:"Sàn khác"};
var MK={VN:"Việt Nam",US:"Mỹ"};
var SHOP_ST={setup:["Đang thiết lập","info"],active:["Đang vận hành","ok"],paused:["Tạm dừng","warn"],stopped:["Đã dừng","mute"]};
var HEALTH={good:["Tốt","ok"],warn:["Cảnh báo","warn"],bad:["Nguy hiểm","bad"]};
var ROLES=["Trưởng nhóm vận hành","Vận hành sàn","Quảng cáo (Ads)","Chăm sóc khách hàng","Content và listing","Booking creator / KOC","Kho và đơn hàng","Kế toán đối soát"];
var STAFF_ST={active:["Đang làm","ok"],probation:["Thử việc","info"],leave:["Nghỉ phép","warn"],left:["Đã nghỉ","mute"]};
var STAFF_MK={VN:"Việt Nam",US:"Mỹ",both:"Cả hai"};
var TASK_TYPES=["Listing / sản phẩm","Quảng cáo","Creator / KOC","Đơn hàng và kho","Chăm sóc khách","Kháng nghị / sự cố","Chương trình sale","Báo cáo / đối soát","Khác"];
var PRIO={urgent:["Gấp","bad",0],high:["Cao","warn",1],normal:["Thường","info",2],low:["Thấp","mute",3]};
var TASK_ST=[["todo","Cần làm"],["doing","Đang làm"],["review","Chờ duyệt"],["done","Xong"]];
var CLIENT_ST={active:["Đang hợp tác","ok"],deal:["Đang đàm phán","info"],ended:["Đã dừng","mute"]};
/* Giờ ca theo giờ Việt Nam; giờ Mỹ được quy đổi theo từng ngày nên tự đúng khi Mỹ đổi giờ mùa đông / mùa hè */
var SHIFTS={
  HC:{label:"Hành chính",s:"08:30",e:"17:30",cls:"vn"},
  S:{label:"Ca sáng",s:"07:00",e:"15:00",cls:"vn"},
  C:{label:"Ca chiều",s:"14:00",e:"22:00",cls:"vn"},
  T:{label:"Ca tối",s:"19:00",e:"23:30",cls:"vn"},
  US:{label:"Ca Mỹ",s:"20:00",e:"04:00",cls:"us"},
  UL:{label:"Ca Mỹ muộn",s:"23:00",e:"07:00",cls:"us"},
  OFF:{label:"Nghỉ",cls:"off"},
  P:{label:"Nghỉ phép",cls:"leave"}
};
var KPI={viol:1,ontime:98,roas:2};

/* ---------- tiện ích ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var pad=function(n){return String(n).padStart(2,"0")};
var TZ={VN:"Asia/Ho_Chi_Minh",NY:"America/New_York",LA:"America/Los_Angeles"};
function partsIn(tz,d){var o={};new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d||new Date()).forEach(function(p){o[p.type]=p.value});return o}
function todayVN(){var p=partsIn(TZ.VN);return p.year+"-"+p.month+"-"+p.day}
function nowMinVN(){var p=partsIn(TZ.VN);return (+p.hour)*60+(+p.minute)}
function d2n(s){var a=s.split("-").map(Number);return Date.UTC(a[0],a[1]-1,a[2])}
function n2d(n){return new Date(n).toISOString().slice(0,10)}
function addDays(s,k){return n2d(d2n(s)+k*864e5)}
function dow(s){return (new Date(d2n(s)).getUTCDay()+6)%7}
function weekStart(s){return addDays(s,-dow(s))}
function daysBetween(a,b){return Math.round((d2n(b)-d2n(a))/864e5)}
function fmtDate(s){if(!s)return "";var a=s.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function fmtDM(s){if(!s)return "";var a=s.split("-");return a[2]+"/"+a[1]}
function monthEnd(m){var a=m.split("-").map(Number);return n2d(Date.UTC(a[0],a[1],0))}
function addMonths(s,k){var a=s.split("-").map(Number);var t=new Date(Date.UTC(a[0],a[1]-1+k,1));var last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return t.getUTCFullYear()+"-"+pad(t.getUTCMonth()+1)+"-"+pad(Math.min(a[2],last))}
function monthsSince(a,b){var x=a.split("-").map(Number),y=b.split("-").map(Number);var n=(y[0]-x[0])*12+(y[1]-x[1]);if(y[2]<x[2])n--;return n}
function monthLabel(m){var a=m.split("-");return "tháng "+(+a[1])+"/"+a[0]}
function hm2min(h){var a=h.split(":").map(Number);return a[0]*60+a[1]}
function usTime(date,hm,tz){var a=hm.split(":").map(Number);var ms=d2n(date)+((a[0]-7)*60+a[1])*6e4;return new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(ms))}
var DOW=["T2","T3","T4","T5","T6","T7","CN"];
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function fmtVND(n){return Math.round(n).toLocaleString("vi-VN")+" ₫"}
function fmtUSD(n){return "$"+Number(n).toLocaleString("en-US",{maximumFractionDigits:0})}
function money(n,m){return m==="US"?fmtUSD(n):fmtVND(n)}
function fmtPct(n){return (Math.round(n*100)/100).toLocaleString("vi-VN")+"%"}
function pill(pair){return pair?'<span class="pill '+pair[1]+'">'+esc(pair[0])+'</span>':""}
function pfTag(p){return '<span class="pf pf-'+esc(p||"other")+'">'+esc(PF[p]||PF.other)+'</span>'}
function mkTag(m){return '<span class="mk '+(m==="US"?"US":"VN")+'">'+(m==="US"?"US":"VN")+'</span>'}
function opt(v,l,cur){return '<option value="'+esc(v)+'"'+(String(cur==null?"":cur)===String(v)?" selected":"")+'>'+esc(l)+'</option>'}

/* ---------- trạng thái ---------- */
var S={view:"mine",loaded:{},shops:[],staff:[],tasks:[],clients:[],taskNotes:[],notes:[],reports:[],repComments:[],sessions:[],kpi:[],docs:[],owner:false,qa:{title:"",shop:"",due:"",prio:"normal",plan:"this"},settings:{},weeks:{},weekExists:{},metrics:{},pay:{},terms:{},
  myId:null,admin:false,readonly:false,week:weekStart(todayVN()),month:todayVN().slice(0,7),
  f:{shop:{q:"",market:"",platform:"",status:"",staff:""},task:{mine:false,staff:"",shop:"",q:"",showDone:false},rep:""}};
var db=null,user=null,subs={},metricsUnsub=null,confirmKey=null,drawer=null;
function fx(){return num(S.settings.fx)||25700}
function overloadLimit(){return num(S.settings.overload)||4}
function toVND(v,m){return m==="US"?num(v)*fx():num(v)}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null}
function staffName(id){var s=byId(S.staff,id);return s?s.name:""}
function clientName(id){var c=byId(S.clients,id);return c?c.name:"Shop nhà TIMUS"}
function shopName(id){var s=byId(S.shops,id);return s?s.name:""}
function me(){if(!S.myId)return null;for(var i=0;i<S.staff.length;i++)if(S.staff[i].uid===S.myId)return S.staff[i];return null}
function activeStaff(){return S.staff.filter(function(x){return x.status!=="left"}).sort(function(a,b){return (a.name||"").localeCompare(b.name||"","vi")})}
function cells(week){return S.weeks[week]||{}}
function shiftOf(sid,date){var w=weekStart(date);return (cells(w)[sid]||{})[dow(date)]||""}

/* ---------- phân tích ---------- */
function onShiftNow(){
  var t=todayVN(),y=addDays(t,-1),now=nowMinVN(),out=[];
  activeStaff().forEach(function(st){
    var c=shiftOf(st.id,t),sh=SHIFTS[c];
    if(sh&&sh.s){var s=hm2min(sh.s),e=hm2min(sh.e);if(e>s?(now>=s&&now<e):(now>=s)){out.push({st:st,code:c});return}}
    var cy=shiftOf(st.id,y),shy=SHIFTS[cy];
    if(shy&&shy.s&&hm2min(shy.e)<hm2min(shy.s)&&now<hm2min(shy.e))out.push({st:st,code:cy});
  });
  return out;
}
function kpiOf(shop,m){
  m=m||{};
  var roas=num(m.adSpend)>0?num(m.adSales)/num(m.adSpend):null;
  var applies=shop.launchDate?monthsSince(shop.launchDate,monthEnd(S.month))>=3:false;
  var has=function(k){return m[k]!==undefined&&m[k]!==""&&m[k]!==null};
  return {roas:roas,applies:applies,
    roasOk:roas==null?null:roas>=KPI.roas,
    violOk:has("violation")?num(m.violation)<KPI.viol:null,
    onOk:has("ontime")?num(m.ontime)>=KPI.ontime:null};
}
function stdFixed(n){if(n<=0)return 0;if(n===1)return 8e6;if(n===2)return 13e6;if(n===3)return 17e6;if(n===4)return 20e6;return 20e6+(n-4)*3e6}
function billing(c){
  var shops=S.shops.filter(function(s){return s.clientId===c.id&&s.status==="active"});
  var t=S.terms[c.id]||{},custom=t.feeMode==="custom";
  var first=shops.map(function(s){return s.launchDate}).filter(Boolean).sort()[0];
  var mIdx=first?monthsSince(first,monthEnd(S.month))+1:null;
  var late=mIdx&&mIdx>6;
  var pct=custom?num(late?(t.bonusAfter!==""&&t.bonusAfter!=null?t.bonusAfter:t.bonusFirst):t.bonusFirst):(late?5:4);
  var fixed=custom?num(t.customFixed):stdFixed(shops.length);
  var net=shops.reduce(function(a,s){return a+toVND((S.metrics[s.id]||{}).netSales,s.market)},0);
  var bonus=net*pct/100;
  return {n:shops.length,fixed:fixed,pct:pct,net:net,bonus:bonus,total:fixed+bonus,mIdx:mIdx,custom:custom};
}
function nextRenewal(start){if(!start)return null;var t=todayVN(),d=start,k=0;while(d<=t&&k<200){k++;d=addMonths(start,6*k)}return d}
function nthWeekday(y,m,wd,n){var first=new Date(Date.UTC(y,m-1,1)).getUTCDay();var day=1+((wd-first+7)%7)+(n-1)*7;return y+"-"+pad(m)+"-"+pad(day)}
function lastWeekday(y,m,wd){var last=new Date(Date.UTC(y,m,0));var d=last.getUTCDate()-((last.getUTCDay()-wd+7)%7);return y+"-"+pad(m)+"-"+pad(d)}
var TET={2027:"2027-02-06",2028:"2028-01-26",2029:"2029-02-13"};
function saleEvents(from,span){
  var y0=+from.slice(0,4),out=[];
  [y0,y0+1].forEach(function(y){
    for(var m=1;m<=12;m++)out.push({d:y+"-"+pad(m)+"-"+pad(m),n:"Ngày đôi "+m+"."+m,mk:"VN",big:m>=9});
    if(TET[y])out.push({d:TET[y],n:"Tết Nguyên đán (cao điểm trước Tết)",mk:"VN",big:true});
    var tg=nthWeekday(y,11,4,4);
    out.push({d:addDays(tg,1),n:"Black Friday",mk:"US",big:true});
    out.push({d:addDays(tg,4),n:"Cyber Monday",mk:"US",big:true});
    out.push({d:y+"-12-25",n:"Giáng sinh",mk:"US",big:true});
    out.push({d:y+"-02-14",n:"Valentine",mk:"US",big:false});
    out.push({d:nthWeekday(y,5,0,2),n:"Mother's Day",mk:"US",big:false});
    out.push({d:lastWeekday(y,5,1),n:"Memorial Day",mk:"US",big:false});
    out.push({d:nthWeekday(y,6,0,3),n:"Father's Day",mk:"US",big:false});
    out.push({d:y+"-07-04",n:"Independence Day",mk:"US",big:false});
    out.push({d:nthWeekday(y,9,1,1),n:"Labor Day",mk:"US",big:false});
  });
  var end=addDays(from,span);
  return out.filter(function(e){return e.d>=from&&e.d<=end}).sort(function(a,b){return a.d<b.d?-1:1});
}
function buildAlerts(){
  var t=todayVN(),A=[];
  var live=S.shops.filter(function(s){return s.status==="active"||s.status==="setup"});
  live.forEach(function(s){
    if(!s.ownerId)A.push({tone:"bad",t:"Shop chưa có người phụ trách chính",d:s.name+" · "+(PF[s.platform]||"")+" "+(s.market||""),act:"edit-shop",id:s.id});
    if(s.health==="bad"||s.health==="warn")A.push({tone:s.health==="bad"?"bad":"warn",t:"Sức khỏe shop: "+HEALTH[s.health][0],d:s.name+(s.healthNote?" · "+s.healthNote:""),act:"edit-shop",id:s.id});
    if(s.status==="setup"&&s.handoverDate&&daysBetween(s.handoverDate,t)>28)A.push({tone:"warn",t:"Thiết lập quá 4 tuần chưa mở bán",d:s.name+" · nhận shop "+fmtDate(s.handoverDate)+" ("+daysBetween(s.handoverDate,t)+" ngày)",act:"edit-shop",id:s.id});
  });
  var open=S.tasks.filter(function(x){return x.status!=="done"});
  var late={};open.forEach(function(x){if(x.due&&x.due<t){var k=x.assigneeId||"";late[k]=(late[k]||0)+1}});
  Object.keys(late).forEach(function(k){A.push({tone:"bad",t:late[k]+" việc quá hạn",d:k?staffName(k)||"Nhân viên đã xóa":"Chưa giao cho ai",act:"go-tasks",id:k})});
  var waiting=open.filter(function(x){return x.status==="review"&&x.reviewSince&&daysBetween(x.reviewSince,t)>=2});
  if(waiting.length)A.push({tone:"warn",t:waiting.length+" việc chờ duyệt từ 2 ngày trở lên",d:"Nhắc thương hiệu duyệt ngân sách, khuyến mãi hoặc nội dung",act:"go-tasks",id:""});
  var usShops=S.shops.filter(function(s){return s.status==="active"&&s.market==="US"}).length;
  if(usShops){
    var w=weekStart(t),miss=[];
    for(var i=0;i<7;i++){var d=addDays(w,i);if(d<t)continue;var c=0;activeStaff().forEach(function(st){var sh=SHIFTS[shiftOf(st.id,d)];if(sh&&sh.cls==="us")c++});if(!c)miss.push(DOW[i]+" "+fmtDM(d))}
    if(miss.length)A.push({tone:"warn",t:"Chưa có người trực giờ Mỹ",d:usShops+" shop Mỹ đang chạy; thiếu ca: "+miss.join(", "),act:"go-schedule",id:""});
  }
  activeStaff().forEach(function(st){var n=S.shops.filter(function(s){return s.ownerId===st.id&&(s.status==="active"||s.status==="setup")}).length;if(n>overloadLimit())A.push({tone:"warn",t:"Quá tải: phụ trách chính "+n+" shop",d:st.name+" · ngưỡng đang đặt "+overloadLimit()+" shop",act:"edit-staff",id:st.id})});
  S.shops.filter(function(s){return s.status==="active"}).forEach(function(s){
    var k=kpiOf(s,S.metrics[s.id]);if(!k.applies)return;var bad=[];
    if(k.violOk===false)bad.push("vi phạm ≥ "+KPI.viol+"%");
    if(k.onOk===false)bad.push("chuyển đơn đúng hạn < "+KPI.ontime+"%");
    if(k.roasOk===false)bad.push("ROAS "+k.roas.toFixed(2)+" < "+KPI.roas);
    if(bad.length)A.push({tone:"warn",t:"Chưa đạt chỉ số "+monthLabel(S.month),d:s.name+": "+bad.join(", "),act:"go-performance",id:""});
  });
  S.clients.filter(function(c){return c.status==="active"&&c.contractStart}).forEach(function(c){var r=nextRenewal(c.contractStart);var left=r?daysBetween(t,r):999;if(left<=30)A.push({tone:"info",t:"Hợp đồng đến kỳ gia hạn sau "+left+" ngày",d:c.name+" · kỳ mới từ "+fmtDate(r)+"; báo trước 30 ngày nếu muốn thay đổi",act:"edit-client",id:c.id})});
  if(S.admin){
    var wait=S.reports.filter(function(r){return r.status==="submitted"}).length;
    if(wait)A.push({tone:"warn",t:wait+" báo cáo chờ bạn xem",d:"Đọc và trả lời ở phần trao đổi trong báo cáo",act:"go-reports",id:""});
    var W=weekStart(t),due=vnMs(addDays(W,-1),12);
    activeStaff().filter(function(st){return st.uid&&(!st.startDate||st.startDate<=addDays(W,-7))}).forEach(function(st){var r=repFor("week",addDays(W,-7),st.uid);if(Date.now()>due&&(!r||r.status==="draft"))A.push({tone:"warn",t:"Chưa nộp báo cáo tuần trước",d:st.name+" · hạn 12:00 Chủ nhật "+fmtDM(addDays(W,-1)),act:"go-reports",id:""})});
  }
  var order={bad:0,warn:1,info:2};
  return A.sort(function(a,b){return order[a.tone]-order[b.tone]});
}

/* ---------- vẽ: thanh bên ---------- */
function renderSide(){
  var cnt={mine:myTasks().filter(function(x){return x.status!=="done"}).length,shops:S.shops.filter(function(s){return s.status!=="stopped"}).length,staff:activeStaff().length,tasks:S.tasks.filter(function(t){return t.status!=="done"}).length,clients:S.clients.filter(function(c){return c.status!=="ended"}).length};
  var grp=function(mk,lb){
    var l=S.shops.filter(function(s){return s.status!=="stopped"&&(s.market==="US"?"US":"VN")===mk}).sort(function(a,b){return (a.name||"").localeCompare(b.name||"","vi")});

function workload(){
  var rows=activeStaff().map(function(st){
    var main=S.shops.filter(function(s){return s.ownerId===st.id&&s.status!=="stopped"}).length;
    var sup=S.shops.filter(function(s){return (s.supportIds||[]).indexOf(st.id)>=0&&s.status!=="stopped"}).length;
    var tk=S.tasks.filter(function(x){return x.assigneeId===st.id&&x.status!=="done"}).length;
    return {st:st,main:main,sup:sup,tk:tk};
  });
  if(!rows.length)return '<div class="empty">Chưa có nhân viên.</div>';
  var max=Math.max(1,Math.max.apply(null,rows.map(function(r){return r.main+r.sup})));
  return '<div class="panel"><div class="load">'+rows.map(function(r){
    return '<div class="lrow"><span class="nm">'+esc(r.st.name)+'</span><div class="lbar"><i class="a" style="width:'+(r.main/max*100)+'%"></i><i class="b" style="width:'+(r.sup/max*100)+'%"></i></div><span class="v">'+r.main+' · '+r.sup+' · '+r.tk+' việc</span></div>'}).join("")+'</div></div>';
}
function matrix(){
  var live=S.shops.filter(function(s){return s.status!=="stopped"});

  var pfs=Object.keys(PF).filter(function(p){return live.some(function(s){return s.platform===p})});
  return '<div class="tbl matrix"><table><thead><tr><th>Sàn</th><th>VN</th><th>US</th><th>Tổng</th></tr></thead><tbody>'
   +pfs.map(function(p){var v=live.filter(function(s){return s.platform===p&&s.market!=="US"}).length,u=live.filter(function(s){return s.platform===p&&s.market==="US"}).length;return '<tr><td>'+pfTag(p)+'</td><td class="num">'+(v||"")+'</td><td class="num">'+(u||"")+'</td><td class="num">'+(v+u)+'</td></tr>'}).join("")
   +'</tbody></table></div>';
}

function myTasks(){var m=me(),e=S.myId;return S.tasks.filter(function(x){return (m&&x.assigneeId===m.id)||(!x.assigneeId&&e&&x.createdBy===e)})}
function clProg(x){var c=x.checklist||[];if(!c.length)return "";var d=c.filter(function(i){return i.done}).length;return '<span class="pill '+(d===c.length?"ok":"mute")+'">'+d+'/'+c.length+' bước</span>'}
function fmtTime(ms){if(!ms)return "";var p=partsIn(TZ.VN,new Date(ms));return p.hour+":"+p.minute+" · "+p.day+"/"+p.month}
function authorName(email){for(var i=0;i<S.staff.length;i++)if(S.staff[i].uid&&S.staff[i].uid===email)return S.staff[i].name;return email||""}
function taskLine(x,t){
  var late=x.due&&x.due<t&&x.status!=="done";
  var nlog=S.taskNotes.filter(function(n){return n.taskId===x.id}).length;
  var st=(TASK_ST.filter(function(s){return s[0]===(x.status||"todo")})[0]||["",""])[1];
  var meta=[x.shopId?esc(shopName(x.shopId)):"Việc chung",esc(st),x.due?'<span class="'+(late?"late":"")+'">Hạn '+fmtDM(x.due)+(late?", trễ "+daysBetween(x.due,t)+" ngày":"")+'</span>':"",nlog?nlog+" ghi chép":""].filter(Boolean).join(" · ");
  return '<div class="tl'+(x.status==="done"?" done":"")+'"><input type="checkbox" class="tick" data-act="tick" data-id="'+x.id+'"'+(x.status==="done"?" checked":"")+(S.readonly?" disabled":"")+' aria-label="Đánh dấu xong: '+esc(x.title)+'">'
    +'<div class="tl-b" data-act="edit-task" data-id="'+x.id+'" tabindex="0"><div class="t1">'+esc(x.title)+'</div><div class="t2">'+meta+'</div></div>'+clProg(x)+pill(PRIO[x.priority||"normal"])+'</div>';

  var team=S.notes.filter(function(n){return n.author!==S.myId&&n.shared}).sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0)}).slice(0,10);

async function quickAdd(){

  var m=me(),id=newId("tasks");
  var W=weekStart(todayVN()),pw=S.qa.plan==="this"?W:S.qa.plan==="next"?addDays(W,7):"";
  var due=S.qa.due||todayVN();if(pw&&due<pw)due=pw;
  var ok=await put("tasks/"+id,{title:title,shopId:S.qa.shop||"",assigneeId:m?m.id:"",priority:S.qa.prio||"normal",due:due,status:"todo",checklist:[],planWeek:pw},pw?"Đã thêm vào kế hoạch "+(S.qa.plan==="this"?"tuần này":"tuần sau"):"Đã thêm việc");

function vnMs(date,h,mi){return d2n(date)+((h-7)*60+(mi||0))*6e4}
function leftText(ms){var d=ms-Date.now(),late=d<0;d=Math.abs(d);var hrs=Math.floor(d/36e5),days=Math.floor(hrs/24);var txt=days>=1?days+" ngày "+(hrs%24)+" giờ":hrs>=1?hrs+" giờ "+Math.floor(d%36e5/6e4)+" phút":Math.floor(d/6e4)+" phút";return late?"trễ "+txt:"còn "+txt}
function workMonth(st,date){
  var start=(st&&st.startDate)||date.slice(0,8)+"01";
  if(date<start)return {start:start,end:addDays(addMonths(start,1),-1),idx:0,future:true};
  var n=monthsSince(start,date);var ms=addMonths(start,n);return {start:ms,end:addDays(addMonths(start,n+1),-1),idx:n};
}
function myReports(){return S.reports.filter(function(r){return r.author===S.myId})}
function repFor(kind,start,author){return S.reports.filter(function(r){return r.kind===kind&&r.periodStart===start&&r.author===(author||S.myId)})[0]||null}
function repPill(r,dueMs){
  if(!r||r.status==="draft")return Date.now()>dueMs?'<span class="pill bad">Chưa nộp, '+leftText(dueMs)+'</span>':'<span class="pill '+(dueMs-Date.now()<864e5?"warn":"mute")+'">'+(r?"Nháp, ":"")+leftText(dueMs)+'</span>';
  var late=r.submittedAt&&Date.parse(r.submittedAt)>dueMs;
  return r.status==="reviewed"?'<span class="pill ok">Huy đã xem</span>':'<span class="pill '+(late?"warn":"info")+'">Đã nộp'+(late?" trễ":"")+'</span>';
}
function mySession(){return S.sessions.filter(function(x){return x.author===S.myId&&!x.endedAt})[0]||null}
function onlineMinutes(author,date){
  return S.sessions.filter(function(x){return x.author===author&&x.startedAt&&new Intl.DateTimeFormat("en-CA",{timeZone:TZ.VN}).format(new Date(x.startedAt))===date}).reduce(function(a,x){return a+Math.max(0,((x.endedAt?Date.parse(x.endedAt):Date.now())-Date.parse(x.startedAt))/6e4)},0);
}
function fmtMin(n){n=Math.round(n);return n>=60?Math.floor(n/60)+" giờ "+(n%60)+" phút":n+" phút"}
async function toggleOnline(){

/* ---------- đánh giá tháng ---------- */
function kpiRows(st){
  var email=st.uid||"";if(!email)return [];
  var t=todayVN(),cur=workMonth(st,t);if(cur.future)return [{st:st,m:cur,future:true}];
  var rows=[];
  for(var i=Math.max(0,cur.idx-5);i<=cur.idx;i++){
    var start=addMonths((st.startDate||cur.start),i),end=addDays(addMonths((st.startDate||cur.start),i+1),-1);
    var weeks=[];for(var w=weekStart(start);w<=end;w=addDays(w,7)){var sun=addDays(w,6);if(sun>=start&&sun<=end)weeks.push(w)}
    var late=0,missing=0;weeks.forEach(function(w){var r=repFor("week",w,email),due=vnMs(addDays(w,6),12);if(Date.now()<due)return;if(!r||r.status==="draft")missing++;else if(Date.parse(r.submittedAt)>due)late++});
    var mr=repFor("month",start,email),mdue=vnMs(addDays(end,2),23,59);
    if(Date.now()>mdue){if(!mr||mr.status==="draft")missing++;else if(Date.parse(mr.submittedAt)>mdue)late++}
    var tot=0,dn=0;weeks.forEach(function(w){var p=planStats(st,email,w);tot+=p.total;dn+=p.done});
    var ideas=S.reports.filter(function(r){return r.author===email&&r.status!=="draft"&&r.periodStart>=start&&r.periodStart<=end}).reduce(function(a,r){return a+num(r.ideasCount)},0);
    var rv=S.kpi.filter(function(k){return k.staffId===st.id&&k.month===start})[0]||null;
    rows.push({st:st,m:{start:start,end:end},late:late,missing:missing,pct:tot?Math.round(dn/tot*100):null,tot:tot,ideas:ideas,rv:rv,ended:t>end});
  }
  return rows.reverse();
}
function critPill(v,auto){if(v===true)return '<span class="pill ok">Đạt</span>';if(v===false)return '<span class="pill bad">Chưa đạt</span>';return auto==null?'<span class="pill mute">Chưa đánh giá</span>':'<span class="pill '+(auto?"info":"warn")+'">Gợi ý: '+(auto?"đạt":"chưa đạt")+'</span>'}
function kpiTable(){
  var staffList=S.admin?activeStaff().filter(function(s){return s.uid}):(me()?[me()]:[]);
  if(!staffList.length)return '<div class="empty">'+(S.admin?"Chưa có nhân viên nào gắn email đăng nhập.":"Tài khoản chưa gắn với hồ sơ nhân viên.")+'</div>';
  var h='<div class="tbl"><table><thead><tr>'+(S.admin?'<th>Nhân viên</th>':'')+'<th>Tháng làm việc</th><th>(a) Báo cáo đúng hạn</th><th>(b) Hoàn thành kế hoạch</th><th>(c) Trả lời chat 3 giờ</th><th>(d) Không sai sót</th><th class="num">Ý tưởng</th><th class="num">Khoản bổ sung</th></tr></thead><tbody>';
  var any=false;

function fileSlug(n){return n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d").toLowerCase().replace(/[^a-z0-9.]+/g,"-").replace(/^-+|-+$/g,"")||"file"}
async function uploadDoc(staffId){

var toastT=null;

function fail(e){
  var c=e&&e.code;
  if(c==="invalid_argument")toast("Chưa lưu được: tài khoản của bạn không có quyền sửa mục này.");
  else if(c==="conflict_ref")toast("Chưa xóa được: còn shop hoặc dữ liệu khác đang gắn với mục này.");
  else if(c==="conflict_dup")toast("Chưa lưu được: email đăng nhập này đã gắn với nhân viên khác.");
  else if(c==="bad_value")toast("Chưa lưu được: có ô nhập sai định dạng ("+(e.message||"")+").");
  else if(c==="quota_exceeded")toast("Kho dữ liệu đã đầy. Xóa bớt việc đã xong hoặc dữ liệu mẫu rồi thử lại.");
  else toast("Chưa lưu được"+(c?" ("+c+")":"")+". Thử lại sau ít phút.");

function fieldHTML(f,v){
  var id="f-"+f.k,val=v==null?"":v;
  if(f.type==="section")return '<div class="fsec"><span>'+esc(f.label)+'</span>'+(f.badge||"")+'</div>';
  var inner;
  if(f.type==="select")inner='<select id="'+id+'">'+f.options().map(function(o){return opt(o[0],o[1],val)}).join("")+'</select>';
  else if(f.type==="textarea")inner='<textarea id="'+id+'"'+(f.rows?' rows="'+f.rows+'"':"")+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+'>'+esc(val)+'</textarea>';
  else if(f.type==="check")return '<label class="f chk wide"><input type="checkbox" id="'+id+'"'+(val?" checked":"")+'>'+esc(f.label)+'</label>';
  else if(f.type==="multi"){var arr=Array.isArray(val)?val:[];inner='<div class="checks" id="'+id+'">'+f.options().map(function(o){return '<label><input type="checkbox" value="'+esc(o[0])+'"'+(arr.indexOf(o[0])>=0?" checked":"")+'>'+esc(o[1])+'</label>'}).join("")+(f.options().length?"":'<span class="note">Chưa có lựa chọn</span>')+'</div>'}
  else inner='<input id="'+id+'" type="'+(f.type||"text")+'"'+(f.type==="number"?' step="any" min="0" inputmode="decimal"':"")+' value="'+esc(val)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+'>';
  return '<label class="f'+(f.wide||f.type==="textarea"||f.type==="multi"?" wide":"")+'">'+esc(f.label)+(f.req?" *":"")+inner+(f.hint?'<span class="hint">'+esc(f.hint)+'</span>':"")+'</label>';
}
function readField(f){
  var el=document.getElementById("f-"+f.k);if(!el)return undefined;
  if(f.type==="multi")return [].map.call(el.querySelectorAll("input:checked"),function(i){return i.value});
  if(f.type==="number")return el.value===""?"":num(el.value);
  if(f.type==="check")return el.checked;
  return el.value.trim();
}

    if(!snap.exists){toast("Tuần trước chưa có lịch để chép");return}
    var src=(snap.data()||{}).cells||{},cur=JSON.parse(JSON.stringify(cells(S.week)));
    Object.keys(src).forEach(function(sid){if(!byId(S.staff,sid))return;cur[sid]=Object.assign({},src[sid],cur[sid]||{})});
    await db.doc("schedules/"+S.week).set({week:S.week,cells:cur});
    toast("Đã chép lịch tuần trước (giữ các ô đã xếp tuần này)");
  }catch(e){fail(e)}
}
function watchWeek(w){
  if(!db||subs["w"+w])return;
  subs["w"+w]=db.doc("schedules/"+w).onSnapshot(function(snap){S.weekExists[w]=snap.exists;S.weeks[w]=snap.exists?((snap.data()||{}).cells||{}):{};schedule()},function(){});
}
function setWeek(delta){S.week=delta===0?weekStart(todayVN()):addDays(S.week,7*delta);watchWeek(S.week);render(true)}

/* ---------- số liệu ---------- */
var metricTimers={};
async function saveMetric(input){
  if(!guard())return;
  var sid=input.dataset.metric,f=input.dataset.f,v=input.value===""?"":num(input.value);
  var key=sid+"__"+S.month,cur=Object.assign({},S.metrics[sid]||{});
  if(String(cur[f]==null?"":cur[f])===String(v))return;
  cur[f]=v;cur.shopId=sid;cur.month=S.month;cur.updatedAt=Date.now();
  S.metrics[sid]=cur;
  try{await db.doc("metrics/"+key).set(clean(cur));toast("Đã lưu số liệu")}catch(e){fail(e)}
}
function watchMonth(){
  if(!db)return;
  if(metricsUnsub)metricsUnsub();
  S.metrics={};
  metricsUnsub=db.collection("metrics").where("month","==",S.month).onSnapshot(function(q){var m={};q.docs.forEach(function(d){var o=d.data();if(o&&o.shopId)m[o.shopId]=o});S.metrics=m;schedule()},function(){});
}

/* ---------- CSV ---------- */
function csv(rows){return "﻿"+rows.map(function(r){return r.map(function(c){c=c==null?"":String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\r\n")}
async function exportCsv(kind){
  var dl=null;try{dl=await window.claude.use("downloads")}catch(_){}
  if(!dl){toast("Không tải được ở chế độ xem này");return}
  var rows,t=todayVN();
  if(kind==="shops"){rows=[["Shop","Sàn","Thị trường","Khách hàng","Trạng thái","Phụ trách chính","Hỗ trợ","Kho / 3PL","Ngày nhận","Ngày mở bán","Sức khỏe","Mã shop","Link","Ghi chú"]];S.shops.forEach(function(s){rows.push([s.name,PF[s.platform],s.market,clientName(s.clientId),(SHOP_ST[s.status]||[""])[0],staffName(s.ownerId),(s.supportIds||[]).map(staffName).join("; "),s.warehouse,s.handoverDate,s.launchDate,(HEALTH[s.health]||[""])[0],s.shopCode,s.shopUrl,s.notes])})}
  else if(kind==="staff"){rows=[["Họ tên","Vai trò","Thị trường","Trạng thái","Điện thoại","Email","Zalo / Telegram","Ngày vào","Sàn thành thạo","Số shop chính"]];S.staff.forEach(function(x){rows.push([x.name,x.role,STAFF_MK[x.market],(STAFF_ST[x.status]||[""])[0],x.phone,x.email,x.chat,x.startDate,(x.platforms||[]).map(function(p){return PF[p]}).join("; "),S.shops.filter(function(s){return s.ownerId===x.id}).length])})}
  else{rows=[["Việc","Shop","Người làm","Loại","Ưu tiên","Hạn","Trạng thái","Xong ngày","Ghi chú"]];S.tasks.forEach(function(x){rows.push([x.title,shopName(x.shopId),staffName(x.assigneeId),x.type,(PRIO[x.priority||"normal"]||[""])[0],x.due,(TASK_ST.filter(function(s){return s[0]===x.status})[0]||["",""])[1],x.doneAt,x.notes])})}
  try{await dl.save({filename:"timus-"+kind+"-"+t+".csv",data:csv(rows)})}catch(e){if(e&&e.code!=="declined")toast("Không tải được")}
}

/* ---------- sự kiện ---------- */
function go(view){S.view=view;closePop();try{history.replaceState(null,"","#"+view)}catch(_){}render(true);window.scrollTo(0,0)}
document.addEventListener("click",async function(e){
  var pop=$("#pop");if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('[data-act="slot"]'))closePop();
  var lk=e.target.closest("a");
  if(lk&&!lk.dataset.view&&!lk.dataset.act)return;
  if(lk)e.preventDefault();
  if(e.target.closest("select")&&e.target.closest(".card"))return;
  var t=e.target.closest("[data-view],[data-act]");if(!t)return;
  if(t.dataset.view){go(t.dataset.view);return}
  var a=t.dataset.act,id=t.dataset.id||"";
  switch(a){
    case "close":closeDrawer();return;
    case "dr-save":saveDrawer();return;
    case "dr-del":
      if(confirmKey!=="dr"){confirmKey="dr";t.textContent="Bấm lần nữa để xóa";return}
      confirmKey=null;if(drawer&&drawer.onDelete){var ok=await drawer.onDelete();if(ok)closeDrawer()}return;
    case "add-shop":shopForm();return;
    case "edit-shop":shopForm(byId(S.shops,id));return;
    case "add-staff":staffForm();return;
    case "edit-staff":openStaff(byId(S.staff,id));return;
    case "add-task":taskForm(null,id);return;
    case "edit-task":taskForm(byId(S.tasks,id));return;
    case "add-client":clientForm();return;
    case "edit-client":clientForm(byId(S.clients,id));return;
    case "settings":settingsForm();return;
    case "signout":if(window.TIMUS_AUTH)TIMUS_AUTH.signOut();return;
    case "help":openHelp(id);return;
    case "doc-open":openDoc(id);return;
    case "doc-up":uploadDoc(id);return;
    case "doc-del":
      if(confirmKey!=="doc"+id){confirmKey="doc"+id;t.textContent="Bấm lần nữa để xóa";return}
      confirmKey=null;deleteDoc(id);return;
    case "tour":openTour(0);return;
    case "tour-next":openTour(TOUR_I+1);return;
    case "tour-prev":openTour(TOUR_I-1);return;
    case "tour-close":closeTour();return;
    case "online":toggleOnline();return;
    case "new-report":reportForm(null,id);return;
    case "edit-report":reportForm(byId(S.reports,id));return;
    case "rep-draft":if(drawer){drawer.mode="draft";saveDrawer()}return;
    case "rep-submit":if(drawer){drawer.mode="submit";saveDrawer()}return;
    case "rep-reviewed":if(drawer){drawer.mode="reviewed";saveDrawer()}return;
    case "rc-add":addRepComment();return;
    case "kpi":kpiForm(id);return;
    case "go-reports":go("reports");return;
    case "rep-filter":S.f.rep=id;render(true);return;
    case "add-note":noteForm();return;
    case "edit-note":noteForm(byId(S.notes,id));return;
    case "tick":toggleDone(id,t.checked);return;
    case "cl-toggle":clChange("toggle",+t.dataset.i);return;
    case "cl-del":clChange("del",+t.dataset.i);return;
    case "cl-add":clChange("add");return;
    case "log-add":addLog();return;
    case "log-del":
      if(confirmKey!=="log"+id){confirmKey="log"+id;t.textContent="Xóa?";return}
      confirmKey=null;if(await del("task_notes/"+id))toast("Đã xóa ghi chép");return;
    case "go-tasks":S.f.task.staff=id;S.f.task.mine=false;go("tasks");return;
    case "go-schedule":go("schedule");return;
    case "go-performance":go("performance");return;
    case "mine":S.f.task.mine=!S.f.task.mine;render(true);return;
    case "showdone":S.f.task.showDone=!S.f.task.showDone;render(true);return;
    case "week":setWeek(+id);return;
    case "copy-week":copyWeek();return;
    case "slot":if(S.readonly)return;openPop(t);return;
    case "pick-shift":closePop();setShift(id,+t.dataset.day,t.dataset.code);return;
    case "csv":exportCsv(id);return;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="cl-new"){e.preventDefault();clChange("add");return}
  if(e.key==="Escape"&&$("#tourRoot")&&$("#tourRoot").innerHTML){closeTour();return}
  if(e.key==="Escape"){if(!$("#pop").hidden)closePop();else if(drawer)closeDrawer();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr.click,.card,.pcard")){e.preventDefault();e.target.click()}
});
window.addEventListener("scroll",closePop,{passive:true});
window.addEventListener("hashchange",function(){var h=(location.hash||"").replace("#","");if(R[h]&&h!==S.view){S.view=h;closePop();render(true);window.scrollTo(0,0)}});
document.addEventListener("submit",function(e){if(e.target.id==="qa"){e.preventDefault();quickAdd()}});
document.addEventListener("input",function(e){
  var qa={"qa-title":"title","qa-due":"due"}[e.target.id];if(qa){S.qa[qa]=e.target.value;return}
  var t=e.target,m={"fs-q":["shop","q"],"ft-q":["task","q"]}[t.id];
  if(m){S.f[m[0]][m[1]]=t.value;render(true)}
});
document.addEventListener("change",async function(e){
  var t=e.target;
  var m={"fs-market":["shop","market"],"fs-platform":["shop","platform"],"fs-status":["shop","status"],"fs-staff":["shop","staff"],"ft-staff":["task","staff"],"ft-shop":["task","shop"]}[t.id];
  if(m){S.f[m[0]][m[1]]=t.value;render(true);return}
  var qa={"qa-shop":"shop","qa-prio":"prio","qa-due":"due","qa-plan":"plan"}[t.id];if(qa){S.qa[qa]=t.value;return}
  if(t.id==="perfMonth"&&t.value){S.month=t.value;watchMonth();render(true);return}
  if(t.dataset.metric){t.dataset.dirty="";saveMetric(t);return}
  if(t.dataset.task){
    var x=byId(S.tasks,t.dataset.task);if(!x)return;
    var d=Object.assign({},x,{status:t.value,updatedAt:Date.now()});stamp(d,x.status);
    t.blur();await put("tasks/"+x.id,d,TASK_ST.filter(function(s){return s[0]===t.value})[0][1]==="Xong"?"Đã xong việc":"Đã chuyển trạng thái");
  }
});

/* ---------- khởi động ---------- */
function showBanner(msg){var b=$("#banner");b.textContent=msg;b.hidden=false}
function col(name,key){
  subs[key]=db.collection(name).onSnapshot(function(q){S[key]=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});S.loaded[key]=true;schedule()},function(err){S.loaded[key]=true;if(err&&err.code==="revoked")showBanner("Quyền truy cập dữ liệu đã thay đổi. Tải lại trang.");schedule()});
}
function mapCol(name,key){
  db.collection(name).onSnapshot(function(q){var m={};q.docs.forEach(function(d){m[d.id]=d.data()});S[key]=m;schedule()},function(){});
}
(async function(){
  var h=(location.hash||"").replace("#","");if(R[h])S.view=h;
  renderClocks();setInterval(function(){renderClocks();if(S.view==="overview"&&!drawer)schedule()},30000);
  render(true);
  var c=window.claude;
  try{var r=await Promise.all([c.use("db"),c.use("user")]);db=r[0];user=r[1]}catch(e){db=null;showBanner("Chưa kết nối được dữ liệu: "+((e&&e.message)||"lỗi không rõ")+". Tải lại trang thử lại.")}
  if(!db){render(true);return}
  if(user){
    try{S.myId=await user.id();S.admin=await user.canEdit();S.owner=await user.isOwner();var w=await user.can("data.write");if(w===false){S.readonly=true;showBanner("Bạn đang ở quyền chỉ xem. Nhờ Huy nâng quyền nếu cần cập nhật công việc và lịch ca.")}}catch(_){}
  }
  if(!R[h])S.view=S.admin?"overview":"mine";
  render(true);
  try{if(!S.admin&&!localStorage.getItem("timus-tour-1"))setTimeout(function(){openTour(0)},600)}catch(_){}
  col("shops","shops");col("staff","staff");col("tasks","tasks");col("clients","clients");col("task_notes","taskNotes");col("notes","notes");col("reports","reports");col("report_comments","repComments");col("work_sessions","sessions");col("kpi_reviews","kpi");col("staff_docs","docs");
  db.doc("settings/app").onSnapshot(function(s){S.settings=s.exists?Object.assign({},s.data()):{};schedule()},function(){});
  var tw=weekStart(todayVN());watchWeek(tw);watchWeek(addDays(tw,-7));watchWeek(S.week);
  watchMonth();
  if(S.admin){mapCol("secure/hr/pay","pay");mapCol("secure/biz/terms","terms")}
})();
})();
</script>
